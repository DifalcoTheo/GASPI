# =============================================================================
#  4. SINONIMOS
#
#  Distintas formas de escribir lo mismo en los planos.
#  Cuando aparezca una forma nueva, agregarla aca (una linea) en vez de
#  pedir un cambio en el programa.
#  No distingue mayusculas ni acentos.
# =============================================================================

sinonimos:

  # --- Material: define que columna de peso se usa en las tablas de molde ---
  material:
    galvanizada:
      - galvanizado
      - galvanizada
      - electrocincado
      - electrocincada
      - cincado
      - cincada
    hojalata:
      - hojalata

  # --- Tipo de chapa --------------------------------------------------------
  tipo_chapa:
    perforado:
      - perforado
      - perforada
      - chapa perforada
    ranurado:
      - ranurado
      - ranurada
    desplegado:
      - metal desplegado
      - desplegado
      - desplegada

  # --- Como se conforma -----------------------------------------------------
  conformado:
    espiralado:
      - espiralado
      - espiralada
      - espiraldao
      - espiralda
      - espiraldo
    rolado:
      - rolado
      - rolada
      - rolaldo
      - rrolado

  # --- Tipo de tapa: define cuanto se le descuenta a las estructuras --------
  tipo_tapa:
    mecanizada:
      - mecanizada
      - mecanizado
      - torneada
    repujada:
      - repujada
      - repujado
      - repujadas

  # --- Tipo de medio filtrante ----------------------------------------------
  tipo_medio:
    plisado:
      - plisado
      - plisada
    rolado:
      - rolado
      - rolada


# =============================================================================
#  4b. MEDIOS FILTRANTES
#
#  De "Medios filtrante OF.xlsx". Sirve para dos cosas:
#    1) que el lector reconozca el medio en el texto del plano;
#    2) avisar cuando el plano pide una forma que ese medio no admite,
#       o cuando le falta el dato que siempre lo tiene que acompanar.
#
#  El TEXTO del medio se copia SIEMPRE exacto del plano. Esta lista no lo
#  limita ni lo reemplaza: solo sirve para reconocerlo y para avisar.
#
#  debe_indicar:
#    micronaje  -> tiene que venir con el micronaje (15 um, 10u, 3 micrones)
#    aplicacion -> tiene que decir para que es (aire, fluidos, gases)
#    malla      -> tiene que venir con el N° de malla o con REPS
# =============================================================================

medios_filtrantes:

  - nombre: Microfibra de borosilicato
    formas: [rolado, plisado]
    debe_indicar: micronaje
    se_escribe: [microfibra de borosilicato, borosilicato, microfibra]

  - nombre: Papel celulosico
    formas: [rolado, plisado]
    debe_indicar: aplicacion
    se_escribe: [papel celulosico, celulosico, papel celulosico para]

  - nombre: Velo de vidrio
    formas: [rolado]        # corregido por Ingenieria: va rolado, no plisado
    se_escribe: [velo de vidrio]

  - nombre: Guata
    formas: [rolado]
    se_escribe: [guata]

  - nombre: Punzonado 350gr/m2
    formas: [rolado]
    se_escribe: [punzonado]

  - nombre: Papel polyester 80/20
    formas: [rolado, plisado]
    se_escribe: [papel polyester 80/20, polyester 80/20]

  - nombre: Papel polyester 100%
    formas: [rolado, plisado]
    se_escribe: [papel polyester 100, polyester 100]

  - nombre: Bolsa de carbon activado
    formas: [otro]
    se_escribe: [carbon activado, bolsa de carbon]

  - nombre: Mesh
    formas: [rolado, plisado]
    debe_indicar: malla
    se_escribe: [mesh]

  - nombre: Tubo de fibra de vidrio
    formas: [otro]
    se_escribe: [tubo de fibra de vidrio]

  - nombre: Aramida 80/20
    formas: [rolado]
    se_escribe: [aramida]

  - nombre: Fibra de vidrio impregnada en teflon
    formas: [otro]
    se_escribe: [fibra de vidrio impregnada, fibra de vidrio con teflon,
                 papel de teflon]

# Como se reconoce cada dato que tiene que acompanar al medio.
# Si aparece una forma nueva de escribirlo, se agrega aca.
acompanamiento:
  micronaje:  ['\d+\s*(?:µ|u|micr)', '\d+\s*um\b']
  aplicacion: [aire, fluidos, gases, liquidos, vapor]
  malla:      ['mesh\s*n?°?\s*\d+', '\breps\b', '\d+\s*x\s*\d+']


# =============================================================================
#  5. VALIDACIONES
#
#  nivel: avisa   -> muestra un cartel pero deja guardar
#         bloquea -> no deja guardar hasta corregir
#
#  Durante la prueba conviene dejar TODO en "avisa", y recien ir pasando a
#  "bloquea" lo que ya se sabe que esta bien.
#
#  Las que tienen "expresion" se pueden editar desde aca y el cambio se aplica
#  solo (igual que las formulas). Las que tienen solo "condicion" son
#  estructurales y su logica vive en el programa; aca se puede cambiar el
#  nivel y el mensaje, pero no la condicion.
# =============================================================================

validaciones:

  - id: molde_inexistente
    condicion: "es espiralado y el diametro no esta en la tabla de molde"
    nivel: avisa
    mensaje: "No existe molde para ese diametro. Ver tabla de moldes."

  - id: paso_de_plegado
    condicion: "el paso entre pliegues es menor a 2 veces el espesor del medio"
    expresion: "PI * ID / Q < 2 * espesor_medio"
    nivel: avisa
    mensaje: "El paso de plegado puede ser inviable: demasiados pliegues para ese diametro interno."

  - id: altura_de_pliegue
    condicion: "el pliegue es mas alto que el espacio entre diametros"
    expresion: "Hp > (OD - ID) / 2"
    nivel: avisa
    mensaje: "El pliegue es mas alto que el espacio disponible entre diametros."

  - id: diametros_coherentes
    condicion: "el diametro externo no es mayor que el interno"
    expresion: "OD <= ID"
    nivel: bloquea
    mensaje: "El diametro externo debe ser mayor que el interno."

  - id: codigo_no_coincide
    condicion: "el codigo leido del plano != el codigo del nombre de la carpeta"
    nivel: avisa
    mensaje: "El codigo del plano no coincide con el de la carpeta. Verificar cual es el correcto."
    # Esta validacion sola habria evitado los 27 casos mal cargados que
    # aparecieron en cartuchos.db (SP1398H guardado donde iba SP2022, etc).

  - id: difiere_del_historico
    condicion: "el SP ya se fabrico antes y algun valor difiere"
    nivel: avisa
    mensaje: "Este codigo ya se fabrico con otros valores. Revisar si es un cambio de revision o un error."

  - id: medio_forma_no_admitida
    condicion: "el plano pide una forma que ese medio no admite (ver medios_filtrantes)"
    nivel: avisa
    mensaje: "Ese medio filtrante no figura como apto para esa forma. Verificar."

  - id: medio_incompleto
    condicion: "al medio le falta el dato que siempre lo acompana (ver debe_indicar)"
    nivel: avisa
    mensaje: "Al medio filtrante le falta el dato que lo tiene que acompanar."

  - id: molde_no_coincide_con_cota
    condicion: "el molde que dice la nota y el Ø interno acotado difieren en mas de 3 mm"
    nivel: avisa
    mensaje: "El molde de la nota y el Ø interno acotado no coinciden."


# =============================================================================
#  6. TOLERANCIAS Y CRITERIOS
#
#  Confirmado con Ingenieria: no cambian nunca.
#  Por eso NO son campos que se completan en cada OF: salen de aca.
#  Pendiente de reconfirmar mas adelante.
# =============================================================================

tolerancias:
  nucleo: "+/- 1 mm"
  jaula: "+/- 1 mm"
  nucleo_intermedio: "+/- 1 mm"
  altura_final: "+/- 1 mm"
  paralelismo: "1 mm"
  diametro_ext_tapa: "+/- 0.5 mm"
  diametro_int_tapa: "+/- 0.5 mm"
  diametro_ext_filtro: "+/- 0.1 mm"
  diametro_int_filtro: "+ 0.1 mm"

criterios_de_aceptacion:
  - "Limpieza: no debe haber pegamento en los laterales"
  - "Adhesivo: el poliuretanico debe ser uniforme"
  - "Medio filtrante 1: igual cantidad de pliegues en todos"
  - "Medio filtrante 2: distribucion uniforme de los pliegues"
  - "Medio filtrante 3: el medio filtrante no debe estar danado"
  - "Oring 1: no debe salirse facilmente del alojamiento"
  - "Oring 2: debe oponerse al paso del probador (si hay)"


# =============================================================================
#  7. IDENTIDAD DE LA ORDEN
#
#  La identidad NO se lee del PDF: se lee del nombre de la carpeta, que es
#  informacion escrita a proposito y no hay que adivinarla.
#  Del PDF salen solo los datos tecnicos.
# =============================================================================

nomenclatura:
  formato: "SPF-XXXX-A-CLIENTE-SPYYYY"
  partes:
    SPF-XXXX: "lote de fabricacion"
    A: "numero de linea dentro del lote (1, 2, 3...). Un plano por linea."
    CLIENTE: "cliente, o STOCK si es para stock"
    SPYYYY: "codigo del producto"

  # Los codigos con sufijo (SP1398H, SP2481-D, SP1179M, SP2506 V2) son
  # variantes o modificaciones del codigo base: ficha propia, con un puntero
  # al codigo del que derivan para poder clonarla.
  sufijos_de_variante: true


# =============================================================================
#  8. LECTURA DEL PLANO
# =============================================================================

lectura_plano:

  # Marca que tiene que aparecer en el plano para considerarlo normalizado.
  # Sin esta marca, el plano es viejo: se lee lo que se pueda y todo queda
  # marcado para que una persona lo confirme.
  marca_normalizado: "FT-v1"

  # Lo que sale de las cotas por geometria, sin que nadie escriba nada:
  #   - texto de cota rotado ~90 grados  -> ALTURA
  #   - de las cotas horizontales, la mayor -> OD, la menor -> ID
  desde_cotas: [ALTURA, OD, ID]

  # Lo unico que hay que declarar en el cuadro del plano normalizado:
  cuadro_minimo:
    - FORMATO           # SOE / SCE / DOE / DCE
    - NUCLEO            # material | perforacion | espesor | Oi   (o "-")
    - JAULA             # idem                                    (o "-")
    - MEDIO             # medio filtrante y soporte, texto libre
  # En los espiralados el Oi no hace falta: alcanza con el molde, que ya
  # figura hoy en el plano ("Molde O77"), y sale de la tabla de la seccion 3.

  # El texto libre se copia EXACTO del plano, nunca se interpreta
  # ni se limita con una lista.
  texto_libre: [MEDIO, SOPORTE, GRABADO, ETIQUETADO, OBSERVACIONES]


# =============================================================================
#  9. PENDIENTES
#  Cosas decididas pero todavia no cerradas. Se resuelven mas adelante.
# =============================================================================

pendientes:
  - "Reconfirmar que las tolerancias y criterios de aceptacion no cambian nunca."
  - "Canastos: segunda familia a incorporar (fichas historicas ya migradas)."
  - "Conos, discos, tapas y fondos: despues de canastos."
  - "Cumplimiento de la norma de calidad interna: postergado hasta que el sistema funcione."
  - "Impresion de la OF: por ahora no se imprime, solo se imprimen planos. No descartado."
  - "Autocontroles digitales de produccion: fase posterior."
