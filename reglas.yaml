# =============================================================================
#  SISTEMA DE ORDENES DE FABRICACION  -  ARCHIVO DE REGLAS
# =============================================================================
#
#  Este archivo NO es documentacion: es lo que el sistema ejecuta.
#  Si aca dice 20, el sistema calcula 20. Si lo cambias a 25, calcula 25.
#  No hay ningun otro lugar donde esten escritas estas reglas.
#
#  COMO EDITARLO
#    - Se abre con el Bloc de notas. Es texto comun.
#    - Respetar los espacios del principio de cada linea (la sangria importa).
#    - Todo lo que empieza con # es un comentario y el sistema lo ignora.
#    - Los decimales van con PUNTO (0.5), no con coma.
#
#  IMPORTANTE
#    Al cambiar algo, subir "version" y poner la fecha.
#    Cada OF guarda con que version de reglas se calculo, asi una OF vieja
#    siempre se puede volver a explicar con las reglas que regian ese dia.
#
# =============================================================================

version: 4
vigente_desde: 2026-08-19
alcance: cartuchos          # canastos, conos y el resto se agregan mas adelante


# =============================================================================
#  1. PARAMETROS
#  Numeros sueltos con nombre. Se usan en las formulas de mas abajo.
#  Cambiar un numero aca lo cambia en todas las formulas que lo usan.
# =============================================================================

parametros:

  # Solapa para las piezas que se cierran solapadas. Total, no por vuelta.
  solapa_mm: 20

  # Por debajo de este espesor la chapa se cierra SOLAPADA (lleva solapa).
  # De este espesor en adelante se cierra A TOPE (no lleva solapa).
  espesor_limite_solapa_mm: 1

  # El metal desplegado se especifica en kg/m2, no en mm.
  # Este es el espesor equivalente que se usa para calcular el desarrollo.
  espesor_desplegado_mm: 0.5

  # Espesor de toda la chapa espiralada (perforada y ranurada).
  espesor_espiralado_mm: 0.5

  # Cuanto mas bajas van las estructuras (nucleo, nucleo intermedio y jaula)
  # respecto de la altura del filtro. Depende del tipo de tapa.
  # Esta es la altura de la estructura MAS ALTA (la principal).
  descuento_altura_tapa_mecanizada_mm: 3
  descuento_altura_tapa_repujada_mm: 2
  descuento_altura_tapa_otra_mm: 2

  # Cuanto mas baja va cada estructura que NO es la principal, respecto de la
  # principal. La mas alta lleva la altura de arriba; las demas, esto menos.
  descuento_estructura_no_principal_mm: 1

  # Medio ROLADO sobre una estructura ROLADA: el diametro sobre el que se calcula
  # el desarrollo es el Ø INTERNO de esa estructura mas este valor.
  # Desarrollo = PI * (Ø interno estructura + esto) * vueltas + solapa.
  sobreespesor_medio_rolado_mm: 2.5

  # Medio ROLADO sobre una estructura ESPIRALADA: la espiralada no tiene Ø interno
  # cargado, su diametro sale del MOLDE. Ø externo del espiralado = molde + 2 * este
  # espesor. Con 2 mm da molde + 4, que es la tabla molde->externo de nucleos y jaula.
  # Ese Ø externo es el que se usa para el desarrollo del rolado que va encima.
  espesor_espiralado_rolado_mm: 2

  # Optimizador de corte: separacion entre pieza y pieza (ancho de guillotina
  # + margen). Ingenieria definio 0: la guillotina no resta material aunque en
  # la realidad algo se lleve. Si algun dia se quiere contemplar, se pone aca.
  separacion_corte_mm: 0


# =============================================================================
#  1b. ALTURA DE CADA ESTRUCTURA  (cual es la mas alta)
#
#  La estructura MAS ALTA lleva la altura calculada (altura del filtro menos el
#  descuento por tapa); las demas, 1 mm menos (descuento_estructura_no_principal_mm).
#  Cual es la mas alta se decide asi:
#
#    - Solo roladas, mismo espesor:     la mas importante (NI > JA > NU).
#    - Solo roladas, distinto espesor:  la de MAYOR espesor (empate -> NI > JA > NU).
#    - Roladas + espiraladas:           una rolada (nunca una espiralada); entre
#                                       las roladas, la de mayor espesor, y si
#                                       empatan, la mas importante (NI > JA > NU).
#    - Solo espiraladas:                la mas importante (NI > JA > NU).
#    - Metal desplegado:                nunca es la mas alta, este donde este;
#                                       salvo que TODAS sean desplegado, y ahi
#                                       vale NI > JA > NU.
#
#  "Rolada" = cualquier estructura que no sea espiralada.
#  Orden de importancia para desempatar (de mas a menos importante):
orden_importancia_estructuras: [nucleo_int, jaula, nucleo]


# =============================================================================
#  3b. CHAPAS ESTANDAR
#  Las medidas de chapa que se compran habitualmente, para el optimizador de
#  corte. Se pueden elegir de esta lista o cargar una a mano (ej. un recorte).
#  Agregar o quitar medidas es editar esta lista.
# =============================================================================

chapas_estandar:
  - {nombre: "1000 x 2000", ancho: 1000, alto: 2000}
  - {nombre: "1220 x 2440", ancho: 1220, alto: 2440}
  - {nombre: "1250 x 2500", ancho: 1250, alto: 2500}
  - {nombre: "1500 x 3000", ancho: 1500, alto: 3000}


# =============================================================================
#  2. FORMULAS
#
#  Notacion:  Oi   = diametro interno
#             Oext = diametro externo
#             esp  = espesor de la chapa
#             Q    = cantidad de pliegues
#             Hp   = altura de pliegue
# =============================================================================

formulas:

  # --- NUCLEO / JAULA (chapa perforada, ranurada o desplegada) --------------

  desarrollo_chapa_rolada_solapada:
    cuando: "rolada y esp < espesor_limite_solapa_mm"
    formula: "(Oi + esp) * PI + solapa_mm"

  desarrollo_chapa_rolada_a_tope:
    cuando: "rolada y esp >= espesor_limite_solapa_mm"
    formula: "(Oi + esp) * PI"

  desarrollo_desplegado_rolado:
    cuando: "metal desplegado, rolado"
    formula: "(Oi + espesor_desplegado_mm) * PI + solapa_mm"

  desarrollo_chapa_espiralada:
    cuando: "espiralada (perforada, ranurada o desplegada)"
    fuente: tabla      # no se calcula: sale de las tablas de molde (seccion 3)

  # --- MEDIO FILTRANTE ------------------------------------------------------

  desarrollo_medio_plisado:
    formula: "Q * Hp * 2 + Q"
    # Sin solapa. El "+ Q" es el agregado por pliegue.

  desarrollo_medio_rolado:
    formula: "PI * Oext * vueltas + solapa_mm"
    # Oext = diametro sobre el que se enrolla, segun la estructura elegida ("rolado sobre"):
    #   - estructura ROLADA:     Ø interno + sobreespesor_medio_rolado_mm
    #   - estructura ESPIRALADA: Ø externo del molde (ver diametro_externo_espiralado)
    # La solapa se suma UNA sola vez, no por vuelta.

  diametro_externo_espiralado:
    formula: "molde + 2 * espesor_espiralado_rolado_mm"
    # Ø externo de un nucleo/jaula ESPIRALADO a partir del molde. Con espesor 2 mm
    # da molde + 4, que es la tabla molde->externo (Tabla_nucleos_Jaula).
    #
    # NOTA (acordado con Ingenieria): esta formula toma todas las vueltas
    # sobre el mismo diametro, cuando en realidad cada vuelta va sobre la
    # anterior y es un poco mas larga. La diferencia se acepta a proposito
    # porque este valor se usa como CONSUMO ESTIMADO, no para cortar.

  # --- ALTURA DE LAS ESTRUCTURAS -------------------------------------------

  altura_estructuras:
    cuando: "altura del nucleo, del nucleo intermedio y de la jaula"
    formula: "altura - descuento"
    # El descuento sale del tipo de tapa (ver parametros):
    #   tapa mecanizada -> 3 mm     tapa repujada -> 2 mm
    #   tapa no reconocida u otra -> 2 mm
    # Las tres estructuras llevan la misma altura.

  # --- CONSUMO DE MATERIAL --------------------------------------------------

  consumo_chapa_espiralada:
    formula: "peso_por_metro * (altura_mm / 1000)"
    # peso_por_metro sale de las tablas de la seccion 3, columna segun material
    # (ver sinonimos de material en la seccion 4). Resultado en gramos.


# =============================================================================
#  3. TABLAS DE MOLDE
#
#  Estas tablas describen los moldes que HAY en planta. No son una formula.
#  (Hoy el diametro externo da siempre molde+3 en perforado y molde+4 en
#  ranurado, pero eso describe los moldes existentes, no una ley: si manana
#  entra un molde que no sigue el patron, se agrega la fila y listo.)
#
#  Un diametro que no este en la tabla NO SE PUEDE FABRICAR espiralado.
#
#  Orden de las columnas:
#    [ diam_molde , diam_externo , peso_x_metro_galvanizada_g , peso_x_metro_hojalata_g ]
#  Espesor de chapa: siempre 0.5 mm (ver parametros).
# =============================================================================

