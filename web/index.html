<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Órdenes de Fabricación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Paleta "Industrial Nexus" (Stitch): navy sobre azul claro */
  :root{
    --morado-osc:#001f3f;   /* barras / cabeceras oscuras (primary-container) */
    --morado:#305ea0;       /* acentos, links, activo (secondary) */
    --morado-claro:#afc8f0; /* apagado sobre oscuro */
    --lila:#dce9ff;         /* fondo de pestañas (surface-container-high) */
    --lila2:#eff4ff;        /* tinte / hover (surface-container-low) */
    --borde:#c4c6cf;        /* borde fino (outline-variant) */
    --texto:#0b1c30;        /* on-surface */
    --gris:#43474e;         /* on-surface-variant */
    --navy:#000613;         /* primary: botón principal */
    --canvas:#0f1e33;       /* fondo del visor de plano */
    --ok:#166534; --ok-bg:#dcfce7; --ok-bor:#86c99a;
    --warn:#8a4b00; --warn-bg:#ffedd5; --warn-bor:#e0b062;
    --mal:#ba1a1a; --mal-bg:#ffdad6; --mal-bor:#e69a95;
    --font: "Inter","Segoe UI",Arial,sans-serif;
    --mono: "JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{font-family:var(--font); margin:0; background:#f8f9ff;
       color:var(--texto); font-size:14px; -webkit-font-smoothing:antialiased;}

  header{background:#fff; color:var(--texto); padding:0 24px; height:60px; display:flex;
         align-items:center; gap:22px; flex-wrap:wrap; border-bottom:1px solid var(--borde);
         position:sticky; top:0; z-index:50;}
  header h1{font-size:18px; margin:0; font-weight:700; color:var(--navy);
            white-space:nowrap; letter-spacing:-.01em;}
  header .sep{flex:1;}
  header .meta{font-size:11px; color:var(--gris); font-family:var(--mono);}
  nav{display:flex; gap:2px; flex-wrap:wrap; align-items:center;}
  nav button{background:transparent; color:var(--gris); border:none; border-bottom:2px solid transparent;
             padding:8px 12px; cursor:pointer; font-size:12px; font-weight:600;
             text-transform:uppercase; letter-spacing:.05em; font-family:inherit; white-space:nowrap;}
  nav button:hover{color:var(--navy);}
  nav button.activo{color:var(--navy); border-bottom-color:var(--navy);}
  nav .pastilla{background:var(--morado); color:#fff; font-size:10px; padding:1px 6px;
                border-radius:9999px; margin-left:5px; font-family:var(--mono);}
  nav .pastilla.warn2{background:#c2410c;}
  #navRight{display:flex; gap:2px; align-items:center;}
  /* Nueva OF: botón azul llamativo */
  nav button.btn-nueva{background:var(--morado); color:#fff; border-radius:4px;
             border-bottom:none; padding:8px 16px; letter-spacing:.04em;}
  nav button.btn-nueva:hover{background:#26518c; color:#fff;}
  nav button.btn-nueva.activo{background:var(--morado); color:#fff;}
  /* Tuerca de configuración */
  nav button.btn-gear{padding:7px; border-bottom:none; color:var(--gris);
             display:flex; align-items:center; border-radius:4px;}
  nav button.btn-gear:hover{background:var(--lila2); color:var(--navy);}
  nav button.btn-gear.activo{background:var(--lila); color:var(--navy); border-bottom:none;}
  .modo-taller{background:var(--navy); color:#fff; font-size:11px; padding:6px 12px;
               border-radius:4px; cursor:pointer; border:none; font-family:inherit;
               text-transform:uppercase; letter-spacing:.04em; font-weight:600; margin-left:6px;}

  main{max-width:1180px; margin:22px auto 60px; padding:0 16px;}
  .pagina{display:none;} .pagina.activa{display:block;}
  h2.titulo{font-size:22px; margin:0 0 16px; color:var(--navy); font-weight:600; letter-spacing:-.01em;}

  .card{background:#fff; border:1px solid var(--borde); border-radius:6px;
        margin-bottom:14px; overflow:hidden;}
  .card > h3{background:var(--morado-osc); color:#fff; font-size:12px; margin:0;
             padding:10px 16px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;
             display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .card > h3 button{background:transparent; border:1px solid var(--morado-claro);
                    color:#fff; border-radius:4px; padding:4px 11px; cursor:pointer;
                    font-size:11px; font-family:inherit; text-transform:uppercase;
                    letter-spacing:.04em; font-weight:600;}
  .card > h3 button:hover{background:rgba(255,255,255,.12);}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .campo{padding:10px 16px; border-top:1px solid var(--borde); border-right:1px solid var(--borde);}
  .campo .et{font-size:11px; text-transform:uppercase; letter-spacing:.05em;
             color:var(--gris); font-weight:600; margin-bottom:4px;}
  .campo .va{font-size:15px;} .campo .va.chica{font-size:13px;}
  .campo .nota{font-size:10.5px; color:var(--gris); margin-top:3px; line-height:1.45;}
  input,select,textarea{width:100%; border:1px solid var(--borde); border-radius:4px;
                        padding:7px 9px; font-size:13px; font-family:inherit; background:#fff;
                        color:var(--texto);}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--morado);
                        box-shadow:0 0 0 3px rgba(48,94,160,.15);}
  textarea{resize:vertical; min-height:52px;}
  label.et{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
           color:var(--gris); font-weight:600; margin-bottom:4px;}

  button.primario{background:var(--navy); color:#fff; border:none; border-radius:4px;
                  padding:10px 20px; font-size:12px; font-weight:600; cursor:pointer;
                  font-family:inherit; text-transform:uppercase; letter-spacing:.05em;}
  button.primario:hover{opacity:.9;}
  button.primario:disabled{background:#9aa4b2; cursor:not-allowed; opacity:1;}
  button.chico{background:var(--morado); color:#fff; border:none; border-radius:4px;
               padding:6px 12px; font-size:11px; cursor:pointer; font-family:inherit;
               text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  button.chico:hover{opacity:.9;}
  button.gris{background:#fff; color:var(--gris); border:1px solid var(--borde);}
  button.gris:hover{background:var(--lila2); color:var(--navy);}

  table{width:100%; border-collapse:collapse; background:#fff;}
  th{background:var(--lila); color:var(--gris); font-size:11px; text-transform:uppercase;
     letter-spacing:.05em; padding:9px 12px; text-align:left; font-weight:600;
     border-bottom:1px solid var(--borde);}
  td{padding:9px 12px; border-top:1px solid var(--borde); vertical-align:middle;}
  tbody tr.clic{cursor:pointer;} tbody tr.clic:hover{background:var(--lila2);}
  .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-family:var(--mono);}
  .cod{font-weight:600; color:var(--navy); white-space:nowrap; font-family:var(--mono);}
  .chico2{font-size:11.5px; color:var(--gris);}
  .vacio{padding:34px; text-align:center; color:var(--gris); background:#fff;
         border:1px solid var(--borde); border-radius:6px;}

  .pill{display:inline-block; font-size:10px; padding:2px 8px; border-radius:9999px;
        white-space:nowrap; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .pill.pendiente{background:var(--surface-container,#e5eeff); color:#334155;}
  .pill.en_produccion{background:#dbeafe; color:#1e40af;}
  .pill.pausada{background:var(--warn-bg); color:var(--warn);}
  .pill.finalizada{background:var(--ok-bg); color:var(--ok);}
  .pill.ok{background:var(--ok-bg); color:var(--ok);}
  .pill.warn{background:var(--warn-bg); color:var(--warn);}
  .pill.mal{background:var(--mal-bg); color:var(--mal);}

  .aviso{padding:10px 16px; font-size:12.5px; border-left:4px solid var(--warn);
         background:var(--warn-bg); color:var(--warn);}
  .aviso.mal{background:var(--mal-bg); border-left-color:var(--mal); color:var(--mal);}
  .aviso.ok{background:var(--ok-bg); border-left-color:var(--ok); color:var(--ok);}
  .status{font-size:12.5px; padding:10px 14px; border-radius:4px; margin:10px 0;}
  .status.info{background:var(--lila); color:var(--morado-osc);}
  .status.ok{background:var(--ok-bg); color:var(--ok);}
  .status.warn{background:var(--warn-bg); color:var(--warn);}
  .crudo{font-family:var(--mono); font-size:11.5px; background:var(--lila2);
         padding:2px 6px; border-radius:3px; color:var(--morado-osc);}

  .zona{border:2px dashed var(--borde); border-radius:6px; background:#fff;
        padding:26px 20px; text-align:center; cursor:pointer; margin:0;}
  .zona:hover,.zona.encima{background:var(--lila2); border-color:var(--morado);}
  .zona b{color:var(--navy); font-size:15px;}

  .dos{display:grid; grid-template-columns:minmax(300px,1fr) minmax(320px,1fr);
       gap:16px; align-items:start;}
  @media(max-width:920px){.dos{grid-template-columns:1fr;}}
  .plano-caja{background:var(--canvas); border:1px solid var(--borde); border-radius:6px;
              overflow:hidden; position:sticky; top:70px;}
  .plano-marco{position:relative; line-height:0; background:var(--canvas);
               background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 0);
               background-size:22px 22px;}
  .plano-marco img{width:100%; display:block;}
  .marca{position:absolute; border:1.5px solid transparent; border-radius:2px;
         cursor:pointer;}
  .marca.cota{border-color:#34d399; background:rgba(52,211,153,.16);}
  .marca.nota{border-color:#60a5fa; background:rgba(96,165,250,.14);}
  .marca.duda{border-color:#fb923c; background:rgba(251,146,60,.26);}
  .marca:hover{background:rgba(251,146,60,.5);}
  .leyenda{padding:8px 12px; font-size:10.5px; color:var(--morado-claro); display:flex;
           gap:12px; flex-wrap:wrap; border-top:1px solid rgba(255,255,255,.1); background:var(--morado-osc);}
  .leyenda a{color:#8fc0ff;}
  .leyenda i{display:inline-block; width:9px; height:9px; border-radius:2px;
             margin-right:4px; vertical-align:-1px;}

  .leido{padding:9px 14px; border-top:1px solid var(--borde); display:grid;
         grid-template-columns:118px 1fr; gap:10px; align-items:start;}
  .leido .et{font-size:11px; text-transform:uppercase; letter-spacing:.04em;
             color:var(--gris); font-weight:600; padding-top:6px;}
  .leido.alta input{background:var(--ok-bg); border-color:var(--ok-bor);}
  .leido.media input{background:var(--warn-bg); border-color:var(--warn-bor);}
  .leido.baja input{background:var(--mal-bg); border-color:var(--mal-bor);}
  .leido.falta input{background:#f1f5f9; border-style:dashed;}
  .leido .porque{font-size:10px; color:var(--gris); margin-top:3px; line-height:1.45;}
  .leido .porque a{color:#eaf1fb; text-decoration:underline;}   /* link legible sobre fondo oscuro */

  .duda{padding:10px 14px; border-top:1px solid var(--borde); background:var(--warn-bg);}
  .duda.listo{background:var(--ok-bg);}
  .duda .txt{font-family:var(--mono); font-size:11.5px; background:#fff;
             border:1px solid var(--borde); border-radius:4px; padding:3px 7px;
             display:inline-block; margin-bottom:5px;}
  .duda .por{font-size:11px; color:var(--warn); margin-bottom:6px;}
  .duda .bts{display:flex; gap:6px; flex-wrap:wrap;}

  .linea-fila{display:flex; align-items:center; gap:11px; padding:11px 16px;
              border-top:1px solid var(--borde); flex-wrap:wrap;}
  .linea-fila .nro{font-size:13px; font-weight:600; color:var(--navy);
                   min-width:96px; font-family:var(--mono);}
  .linea-fila .desc{flex:1; min-width:150px;}
  .linea-fila .desc .t{font-size:14px;}
  .linea-fila input[type=number]{width:70px;}

  .calc{background:var(--ok-bg);} .calc .va{color:var(--ok); font-weight:700; font-family:var(--mono);}
  .calc.no{background:#f1f5f9;} .calc.no .va{color:var(--gris); font-weight:400; font-size:13px; font-family:var(--font);}

  .coment{padding:10px 16px; border-top:1px solid var(--borde); font-size:13px;}
  .coment .quien{font-size:10.5px; color:var(--gris); margin-bottom:2px;}

  /* portada de rol */
  #portada{position:fixed; inset:0; z-index:300; background:rgba(0,6,19,.55);
           display:flex; align-items:center; justify-content:center; padding:20px;}
  .portada-caja{background:#0E1E29; border-radius:14px; max-width:640px; width:100%;
                padding:30px 28px; box-shadow:0 18px 60px rgba(0,0,0,.55);
                border:1px solid #24384a; color:#EAF1FB;}
  .portada-tit{font-size:26px; font-weight:700; color:#FFFFFF; text-align:center; letter-spacing:-.01em;}
  .portada-sub{font-size:14px; color:#9DB2CE; text-align:center; margin:6px 0 22px;}
  .portada-bts{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:560px){.portada-bts{grid-template-columns:1fr;}}
  .portada-b{background:#132635; border:1.5px solid #2A3F52; border-radius:11px;
             padding:20px 16px; cursor:pointer; text-align:center; font-family:inherit; color:#EAF1FB;
             transition:border-color .14s, background .14s, box-shadow .14s;}
  .portada-b:hover{background:#17304a; border-color:rgba(76,141,255,.7);}
  .portada-b.sel{border-color:#4C8DFF; background:#17304a; box-shadow:0 0 0 3px rgba(76,141,255,.25);}
  .portada-b .ic{font-size:34px;}
  .portada-b .n{font-size:17px; font-weight:700; color:#EAF1FB; margin:8px 0 4px;}
  .portada-b.ing .n{color:#7FB0FF;}
  .portada-b.prod .n{color:#34D3C2;}
  .portada-b.comp .n{color:#E0A35F;}
  .portada-b .d{font-size:12px; color:#9DB2CE; line-height:1.5;}
  .portada-pie{font-size:11.5px; color:#6E8298; text-align:center; margin-top:16px;}

  /* galeria de planos */
  .galeria{display:flex; gap:6px; flex-wrap:wrap; padding:8px 10px;
           border-top:1px solid rgba(255,255,255,.1); background:var(--morado-osc);}
  .galeria .mini{width:54px; height:54px; border:2px solid transparent; border-radius:4px;
                 overflow:hidden; cursor:pointer; background:#fff; flex:none; position:relative;}
  .galeria .mini img{width:100%; height:100%; object-fit:cover;}
  .galeria .mini.sel{border-color:#60a5fa;}
  .galeria .mini .x{position:absolute; top:0; right:0; background:var(--mal); color:#fff;
                    font-size:10px; width:15px; height:15px; line-height:15px; text-align:center;
                    border-radius:0 0 0 4px;}
  .galeria .mas{width:54px; height:54px; border:2px dashed rgba(255,255,255,.35); border-radius:4px;
                display:flex; align-items:center; justify-content:center; cursor:pointer;
                color:#8fc0ff; font-size:24px; flex:none;}
  .galeria .mas:hover{background:rgba(255,255,255,.08);}

  /* pestañas del detalle de línea — todas a la vista, sin barra deslizante */
  .ltabs{display:flex; flex-wrap:wrap; gap:0; margin-bottom:14px;
         border-bottom:1px solid var(--borde); background:var(--lila); border-radius:6px 6px 0 0;}
  .ltabs button{flex:1 1 128px; background:transparent; color:var(--gris); border:none;
                border-bottom:2px solid transparent; padding:11px 12px; font-size:12px;
                font-weight:600; text-transform:uppercase; letter-spacing:.04em;
                font-family:inherit; cursor:pointer; white-space:nowrap; text-align:center;}
  .ltabs button:hover{color:var(--navy);}
  .ltabs button.activa{background:#fff; color:var(--navy); border-bottom-color:var(--navy);}
  .chk{display:inline-flex; align-items:center; gap:8px; font-size:15px;}
  .chk .si,.chk .no{font-size:16px;} .chk .no{opacity:.5;}
  body.taller .ltabs button{padding:13px 16px; font-size:14px; flex-basis:150px;}

  /* encabezado de la orden: LOTE·LÍNEA remarcado + PRODUCTO */
  .of-encabezado{display:flex; flex-wrap:wrap; align-items:stretch; margin-bottom:16px;
                 border:1px solid var(--borde); border-radius:8px; overflow:hidden; background:#fff;}
  .of-enc-bloque{padding:12px 22px; display:flex; flex-direction:column; justify-content:center; gap:3px;}
  .of-enc-bloque.lote{background:var(--morado-osc); color:#fff;}
  .of-enc-bloque.prod{flex:1;}
  .of-enc-et{font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; opacity:.75;}
  .of-enc-val{font-size:26px; font-weight:700; font-family:var(--mono); letter-spacing:-.5px; line-height:1.05;}
  .of-enc-bloque.prod .of-enc-val{color:var(--navy);}
  body.taller .of-enc-val{font-size:30px;}

  /* grilla fija de 3 columnas para "qué lleva" y "avance" */
  .qlleva{display:grid; grid-template-columns:repeat(3,1fr);}
  @media(max-width:640px){.qlleva{grid-template-columns:repeat(2,1fr);}}
  .campo.avance.ok{background:var(--ok-bg);}
  .chk-parte{align-items:flex-start;} .chk-parte .nota{font-weight:400;}

  /* optimizador de corte */
  .opt-chapa{background:#fff; border:1px solid var(--borde); border-radius:4px; display:inline-block;}
  .opt-svg{width:100%; height:auto; display:block;}
  .opt-pieza{fill:rgba(48,94,160,.20); stroke:var(--morado); stroke-width:1;}
  .opt-controles{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; padding:12px 16px;}
  .opt-controles > div{min-width:90px;}
  .opt-controles label{display:block; font-size:11px; text-transform:uppercase;
                       color:var(--gris); font-weight:600; margin-bottom:4px; letter-spacing:.04em;}
  .opt-res{display:flex; gap:20px; flex-wrap:wrap; padding:6px 16px 12px;}
  .opt-res .n{font-size:24px; font-weight:700; color:var(--navy); font-family:var(--mono);}
  .opt-res .t{font-size:10.5px; text-transform:uppercase; color:var(--gris); letter-spacing:.04em;}

  /* modo taller: mas grande, sin edicion */
  body.taller{font-size:16px;}
  body.taller .campo .va{font-size:19px;}
  body.taller .calc .va{font-size:22px;}
  body.taller .campo .nota,body.taller .chico2{font-size:13px;}
  body.taller .solo-ing{display:none !important;}
/* ===== Shell nuevo (rediseño Etapa 1) — cajón lateral azul ===== */
:root{ --gp-bg:#081426; --gp-bg2:#0E2140; --gp-drawer:#0A1A31; --gp-ink:#EAF1FB;
  --gp-muted:#8AA0C0; --gp-faint:#45608A; --gp-line:#2C4A78; --gp-accent:#4C8DFF;
  --gp-accsoft:rgba(76,141,255,.16); --gp-chip:#10213E; --gp-chipbrd:#294A7A; --gp-amber:#F4A93C;
  --gp-mono:"IBM Plex Mono",ui-monospace,monospace; --gp-disp:"Space Grotesk",system-ui,sans-serif; }
header{ display:none !important; }
main{ padding-top:66px !important; }
/* Panel principal = nodo lateral (stage oscuro, solo visible cuando el panel esta activo) */
#pag-panel{ padding:0 !important; }
.gp-stage{ position:fixed; inset:0; z-index:1; overflow:hidden;
  background:radial-gradient(circle at 72% 50%, rgba(76,141,255,.10), transparent 60%), var(--gp-bg); }
.gp-stage::before{ content:""; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(rgba(76,141,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(76,141,255,.05) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 72% 50%,#000 0%,transparent 80%); mask-image:radial-gradient(circle at 72% 50%,#000 0%,transparent 80%); }
.gp-wires{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.gp-wire{ fill:none; stroke:var(--gp-line); stroke-width:1.6; }
.gp-node{ position:absolute; display:grid; place-content:center; text-align:center; border-radius:50%; transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 40%, var(--gp-accsoft), transparent 68%), var(--gp-bg2);
  border:1px solid rgba(76,141,255,.55);
  box-shadow:0 0 0 10px rgba(76,141,255,.05),0 0 90px -18px rgba(76,141,255,.55),inset 0 0 46px -18px rgba(76,141,255,.6); z-index:3; padding:18px; }
.gp-node .k{ font-family:var(--gp-mono); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--gp-accent); margin-bottom:8px; }
.gp-node .t{ font-family:var(--gp-disp); font-size:clamp(30px,5vmin,50px); font-weight:700; line-height:1; color:var(--gp-ink); letter-spacing:.02em; }
.gp-node .s{ font-family:var(--gp-mono); font-size:12px; color:var(--gp-muted); margin-top:12px; }
.gp-ind{ position:absolute; transform:translate(-50%,-50%); z-index:2; cursor:pointer; }
.gp-ind:hover .lab .n{ color:var(--gp-accent); }
.gp-ind .dot{ width:64px; height:64px; border-radius:50%; display:grid; place-content:center;
  background:var(--gp-chip); border:1.5px solid var(--gp-chipbrd); color:var(--gp-ink); position:relative; transition:border-color .2s,box-shadow .2s; }
.gp-ind:hover .dot{ border-color:rgba(76,141,255,.7); box-shadow:0 0 34px -10px rgba(76,141,255,.7); }
.gp-ind .dot svg{ width:26px; height:26px; stroke:currentColor; fill:none; }

<script>
/* =========================================================
   BASE
========================================================= */
const $ = s => document.querySelector(s);
const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const nn = v => (v === null || v === undefined || v === "") ? "—" : v;
const mm = v => (v === null || v === undefined) ? "—" :
  (Math.round(v * 10) / 10).toLocaleString("es-AR") + " mm";
const fecha = f => f ? new Date(f + "T00:00").toLocaleDateString("es-AR") : "—";
const ESTADO_TXT = {pendiente:"Pendiente", en_produccion:"En producción",
                    pausada:"Pausada", finalizada:"Finalizada"};

/* rol: 'ingenieria' | 'produccion'. Produccion = vista de taller, sin editar
   (salvo el optimizador de corte, que sí puede tocar). */
let rol = localStorage.getItem("rol");
let taller = rol === "produccion";

function aplicarModo(){
  taller = rol === "produccion" || rol === "compras";
  document.body.classList.toggle("taller", taller);
  const lbl = {ingenieria:"Ingeniería", produccion:"Producción", compras:"Compras"}[rol] || rol;
  const b = $("#btnRol");
  if (b){ b.textContent = lbl + " — cambiar";
    b.style.background = rol === "produccion" ? "#0f766e" : rol === "compras" ? "#7c3a12" : "#305ea0"; }
  const f = $("#gpFootRol"); if (f) f.textContent = "Rol: " + lbl;
}
$("#btnRol").addEventListener("click", elegirRol);

let rolElegido = null;
function elegirRol(){
  const p = $("#portada");
  if (p.dataset.abierta === "1") return;   // ya está abierta (evita pisar la clave tipeada)
  p.dataset.abierta = "1";
  p.style.display = "flex";
  rolElegido = null;
  p.innerHTML = `
    <div class="portada-caja">
      <div class="portada-tit">GASPI</div>
      <div class="chico2" style="text-align:center;margin-top:-2px">Gestión y Automatización de Solicitudes de Producción e Ingeniería</div>
      <div class="portada-sub">Elegí tu equipo e ingresá la contraseña</div>
      <div class="portada-bts">
        <button class="portada-b ing" id="gpRb-ingenieria" onclick="gpMarcar('ingenieria')">
          <div class="ic">🛠️</div><div class="n">Ingeniería</div>
          <div class="d">Carga órdenes, lee planos, edita fichas y datos.</div></button>
        <button class="portada-b prod" id="gpRb-produccion" onclick="gpMarcar('produccion')">
          <div class="ic">🏭</div><div class="n">Producción</div>
          <div class="d">Ve órdenes y planos, cambia estados, comenta, optimizador de corte.</div></button>
        <button class="portada-b comp" id="gpRb-compras" onclick="gpMarcar('compras')">
          <div class="ic">🛒</div><div class="n">Compras</div>
          <div class="d">Acceso a Compras internas y a las órdenes.</div></button>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap;">
        <input type="password" id="gpClave" placeholder="Contraseña"
          style="padding:10px 14px; border:1.5px solid #2A3F52; border-radius:8px; font-size:14px; width:220px;"
          onkeydown="if(event.key==='Enter')gpIngresar()">
        <button class="primario" onclick="gpIngresar()">Ingresar</button>
      </div>
      <div id="gpLoginErr" style="text-align:center; color:#ff6b6b; font-size:13px; min-height:18px; margin-top:8px;"></div>
      <div class="portada-pie">El rol se puede cambiar desde el menú (pide la contraseña del nuevo rol).</div>
    </div>`;
}
function gpMarcar(r){
  rolElegido = r;
  ["ingenieria","produccion","compras"].forEach(x => {
    const b = $("#gpRb-" + x);
    if (b) b.classList.toggle("sel", x === r);
  });
  const c = $("#gpClave"); if (c) c.focus();
}
async function gpIngresar(){
  const err = $("#gpLoginErr");
  if (!rolElegido){ err.textContent = "Primero elegí tu equipo (arriba)."; return; }
  const clave = $("#gpClave").value;
  try{
    const r = await fetch("/api/login", { method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({rol: rolElegido, clave}) });
    if (!r.ok){ err.textContent = "Contraseña incorrecta."; return; }
    setRol(rolElegido);
  }catch(e){ err.textContent = "No se pudo conectar con el servidor."; }
}
function setRol(r){
  rol = r; localStorage.setItem("rol", r);
  const p = $("#portada");
  p.style.display = "none"; p.dataset.abierta = "0";
  aplicarModo();
  irVista('panel');
}

let pagActual = "nueva";
function mostrar(pag){
  pagActual = pag;
  document.querySelectorAll(".pagina").forEach(p => p.classList.remove("activa"));
  $("#pag-" + pag).classList.add("activa");
  document.querySelectorAll("header nav button").forEach(b =>
    b.classList.toggle("activo", b.dataset.pag === pag));
  window.scrollTo(0, 0);
}
document.querySelectorAll("header nav button").forEach(b =>
  b.addEventListener("click", () => {
    const p = b.dataset.pag;
    mostrar(p);
    if (p === "nueva") pantallaNueva();
    if (p === "activas") cargarOF("activas");
    if (p === "finalizadas") cargarOF("finalizadas");
    if (p === "compras") cargarCompras();
    if (p === "filtros") pantallaFiltros();
    if (p === "config") cargarConfig();
  }));

async function guardarEtiqueta(id, v){
  try{
    await api(`/api/linea/${id}/etiqueta`, {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({etiqueta: v})});
  }catch(e){ alert("No se pudo guardar la etiqueta: " + e.message); }
}

async function api(url, opts){
  const r = await fetch(url, opts);
  if (r.status === 401){ elegirRol(); throw new Error("Sesión no iniciada"); }
  if (!r.ok){
    const e = await r.json().catch(() => ({detail:"Error"}));
    throw new Error(e.detail || "Error");
  }
  return r.json();
}

/* =========================================================
   NUEVA OF
========================================================= */
let OF = null;   // {lote, cliente, fecha_oc, fecha_entrega, lineas:[...]}

async function pantallaNueva(){
  if (!OF){
    const p = await api("/api/of/proximo");
    const clientes = await api("/api/clientes");
    OF = {lote:p.lote, ultimo:p.ultimo, cliente:"", fecha_oc:p.fecha_oc,
          fecha_entrega:p.fecha_entrega, dias:p.dias_entrega,
          vendedor:"", clientes, lineas:[], activa:null};
  }
  dibujarNueva();
}

async function recalcularEntrega(){
  const p = await api("/api/of/proximo?fecha_oc=" + encodeURIComponent(OF.fecha_oc));
  OF.fecha_entrega = p.fecha_entrega;
  dibujarNueva();
}

let VENDINFO = null;
async function cargarVendInfo(){
  if (VENDINFO) return;
  try { VENDINFO = await api("/api/vendedores"); }
  catch(e){ VENDINFO = {vendedores: [], por_cliente: {}}; }
}
/* Autocompleta el vendedor según el cliente (mapa del vault). Respeta un
   vendedor puesto a mano: solo pisa si está vacío o si lo puso el automático. */
function autoVendedor(){
  if (!VENDINFO || !OF) return;
  const v = VENDINFO.por_cliente[(OF.cliente || "").trim().toUpperCase()];
  if (v && (!OF.vendedor || OF._vendAuto)){ OF.vendedor = v; OF._vendAuto = true; }
}

function agregarElemento(){
  OF.lineas.push(nuevaLinea());
  OF.activa = OF.lineas.length - 1;
  dibujarNueva();
}

/* Repite un producto ya fabricado: linea armada con la ficha congelada,
   los planos y la etiqueta de la ultima vez. Avisa si tuvo comentarios. */
async function repetirProducto(){
  const cod = ($("#repCodigo").value || "").trim().toUpperCase();
  if (!cod) return;
  let r;
  try { r = await api("/api/producto/" + encodeURIComponent(cod) + "/repetir"); }
  catch(e){ $("#estadoCarga").innerHTML = `<div class="status warn" style="margin:0 12px 12px">${esc(e.message)}</div>`; return; }

  const ln = nuevaLinea();
  ln.producto = r.producto;
  ln.planos = r.planos.map(n => ({lectura: {archivo: n}}));
  ln.etiqueta = r.etiqueta || null;
  ln.repetida = true;
  ln.resumen = "Repetido de " + (r.ultimo_lote || "la biblioteca")
             + (r.etiqueta ? " · etiqueta: " + r.etiqueta : "");
  const abiertos = r.comentarios.filter(c => c.estado === "abierto").length;
  ln.estado = abiertos
    ? {clase: "warn", texto: `Repetido · ${abiertos} comentario(s) abiertos`}
    : {clase: "ok", texto: "Repetido · listo"};
  ln.lista = true;
  OF.lineas.push(ln);
  OF.activa = OF.lineas.length - 1;
  dibujarNueva();

  if (r.comentarios.length){
    const ult = r.comentarios[r.comentarios.length - 1];
    $("#estadoCarga").innerHTML = `<div class="aviso" style="margin:0 12px 12px">
      ⚠ <b>${esc(r.codigo)}</b> tuvo ${r.comentarios.length} comentario(s)/observación(es)
      en ${esc(r.ultimo_lote || "la fabricación anterior")}. Último
      (${esc(ult.usuario || "sin autor")}): “${esc(ult.texto)}”. Revisalo antes de confirmar.</div>`;
  } else {
    $("#estadoCarga").innerHTML = `<div class="status ok" style="margin:0 12px 12px">
      ✔ ${esc(r.codigo)} cargado desde ${esc(r.ultimo_lote || "la biblioteca")}
      con ${r.planos.length} plano(s)${r.etiqueta ? " y su etiqueta" : ""}. Sin comentarios previos.</div>`;
  }
}
function quitarLinea(i){
  OF.lineas.splice(i, 1);
  OF.activa = OF.lineas.length ? Math.min(OF.activa, OF.lineas.length - 1) : null;
  dibujarNueva();
}
function nuevaLinea(){
  return {planos:[], producto:{}, asignaciones:{}, conflictos:[], cantidad:null,
          estado:{clase:"", texto:"vacío"}, lista:false, resumen:"", confirmada:false};
}

/* Sube planos al elemento ACTIVO (o crea el primero si no hay ninguno) */
async function subirVarios(archivos){
  const pdfs = archivos.filter(a => a.name.toLowerCase().endsWith(".pdf"));
  if (!pdfs.length) return;
  if (OF.activa === null){ OF.lineas.push(nuevaLinea()); OF.activa = 0; }
  await agregarPlanos(OF.activa, pdfs);
  dibujarNueva();
}

/* Lee cada PDF y lo agrega a la galería de la línea i, luego re-mergea */
async function agregarPlanos(i, pdfs){
  for (let k = 0; k < pdfs.length; k++){
    $("#estadoCarga") && ($("#estadoCarga").innerHTML =
      `<div class="status info">Leyendo ${k + 1} de ${pdfs.length}: ${esc(pdfs[k].name)}…</div>`);
    try{
      const fd = new FormData(); fd.append("archivo", pdfs[k]);
      const L = await api("/api/leer", {method:"POST", body:fd});
      L.asignaciones = {};
      OF.lineas[i].planos.push({lectura:L});
    }catch(e){
      $("#estadoCarga") && ($("#estadoCarga").innerHTML =
        `<div class="status warn">${esc(pdfs[k].name)}: ${esc(e.message)}</div>`);
    }
  }
  if ($("#estadoCarga")) $("#estadoCarga").innerHTML = "";
  mergearLinea(OF.lineas[i]);
}

/* Combina lo leído de todos los planos de una línea (auto-completar y avisar) */
function productoDeLectura(L){
  const p = Object.assign({}, L.propuesta);
  for (const [k, v] of Object.entries(L.asignaciones || {})){
    if (k.startsWith("_")){
      if (k.endsWith("_txt")){ p[k.slice(1, -4) + "_crudo"] = v; continue; }
      for (const [kk, vv] of Object.entries(v || {})) p[k.slice(1) + "_" + kk] = vv;
    } else p[k] = v;
  }
  return p;
}

function mergearLinea(ln){
  const merged = {}, origen = {}, conflictos = [];
  ln.planos.forEach((pl, pi) => {
    const p = productoDeLectura(pl.lectura);
    for (const [k, v] of Object.entries(p)){
      if (v === null || v === undefined || v === "") continue;
      if (merged[k] === undefined || merged[k] === null || merged[k] === ""){
        merged[k] = v; origen[k] = pi;
      } else if (String(merged[k]) !== String(v)){
        let c = conflictos.find(x => x.campo === k);
        if (!c){ c = {campo:k, opciones:[{pi:origen[k], valor:merged[k]}]}; conflictos.push(c); }
        if (!c.opciones.some(o => String(o.valor) === String(v))) c.opciones.push({pi, valor:v});
      }
    }
  });
  Object.assign(merged, ln.asignaciones);          // resolución manual de conflictos
  // Re-edición: los planos nuevos mandan, pero los campos que el plano no menciona
  // se conservan de lo que ya tenía congelado la orden (ln.base).
  if (ln.base){
    for (const [k, v] of Object.entries(ln.base)){
      if ((merged[k] === undefined || merged[k] === null || merged[k] === "")
          && v !== null && v !== undefined && v !== "") merged[k] = v;
    }
  }
  ln.conflictos = conflictos.filter(c => ln.asignaciones[c.campo] === undefined);
  ln.producto = merged;

  const dudas = ln.planos.reduce((s, pl) =>
    s + pl.lectura.sin_asignar.filter(x => !x.resuelto).length, 0);
  const difs = ln.planos.some(pl => pl.lectura.ya_existe && pl.lectura.ya_existe.diferencias.length);
  const ya = (ln.planos.map(pl => pl.lectura.ya_existe).find(y => y)) || null;

  const d = [];
  if (merged.altura) d.push(`${merged.altura} × Ø${merged.od ?? "?"}`);
  if (merged.medio) d.push(String(merged.medio).slice(0, 42));
  ln.resumen = d.join(" · ");

  if (ln.repetida){ ln.lista = true; return; }   // repetido: ya viene listo de la biblioteca
  if (ln.reedicion && !ln.planos.length){        // re-edición sin plano nuevo aún: se puede corregir a mano
    ln.estado = {clase:"warn", texto:"Sin plano — editable a mano"}; ln.lista = true; return; }
  if (!ln.planos.length){ ln.estado = {clase:"", texto:"vacío"}; ln.lista = false; return; }
  if (dudas){ ln.estado = {clase:"mal", texto:`${dudas} sin asignar`}; }
  else if (ln.conflictos.length){ ln.estado = {clase:"warn", texto:`${ln.conflictos.length} en conflicto`}; }
  else if (difs && !ln.confirmada){ ln.estado = {clase:"warn", texto:"Diferencias con la biblioteca"}; }
  else if (ya){ ln.estado = {clase:"ok", texto:`Ya en biblioteca · ${ya.veces} vez${ya.veces === 1 ? "" : "es"}`}; }
  else { ln.estado = {clase:"ok", texto: ln.planos.length > 1 ? `Leído · ${ln.planos.length} planos` : "Leído completo"}; }
  ln.lista = !dudas && !ln.conflictos.length && (!difs || ln.confirmada);
  if (ln.reedicion) ln.lista = true;   // en re-edición Ingeniería siempre puede confirmar
}

async function confirmarOF(){
  try{
    const r = await api("/api/of", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        lote: OF.lote, cliente: OF.cliente, fecha_oc: OF.fecha_oc,
        fecha_entrega: OF.fecha_entrega, vendedor: OF.vendedor,
        observaciones: OF.obs || null,
        lineas: OF.lineas.map(l => ({producto:l.producto, cantidad:l.cantidad,
          archivos: l.planos.map(pl => pl.lectura.archivo),
          etiqueta: l.etiqueta || null,
          guardar_ficha: !l.repetida}))
      })
    });
    if (OF.enProceso){   // venia de "OF en proceso": ya no espera armado
      try { await api("/api/en_proceso/" + encodeURIComponent(OF.enProceso), {method:"DELETE"}); } catch(e){}
    }
    OF = null;
    await cargarResumen();
    await verLote(r.lote);
  }catch(e){
    $("#estadoCarga").innerHTML = `<div class="status warn">${esc(e.message)}</div>`;
  }
}

/* ---------- revisar / corregir la lectura de una línea ---------- */
let iLinea = null, planoSel = 0, campoActivo = null;
const CAMPOS = [
  ["codigo","Código"],["altura","Altura (mm)"],["od","Diámetro externo (mm)"],
  ["id_int","Diámetro interno (mm)"],
  ["nucleo_diam","Ø interno núcleo (mm)"],
  ["nucleo_int_diam","Ø interno núcleo interm. (mm)"],
  ["jaula_diam","Ø interno jaula (mm)"],
  ["medio","Medio filtrante"],["tipo_medio","Forma del medio"],["vueltas","Vueltas (si es rolado)"],
  ["medio_2","Medio filtrante 2"],["tipo_medio_2","Forma del medio 2"],["vueltas_2","Vueltas 2 (si es rolado)"],
  ["q","Q — pliegues"],["hp","Hp — alt. pliegue"],["tapa","Tapa"],["tapa_2","Tapa 2"],
  ["sello","Sello / junta"],["sello_2","Sello / junta 2"],["adhesivo","Adhesivo"],
  ["observaciones","Observaciones"]];
const SIEMPRE = ["codigo","altura","od","id_int","nucleo_diam","nucleo_int_diam",
                 "jaula_diam","medio","q","hp"];
const NUMERICOS = ["altura","od","id_int","nucleo_diam","nucleo_int_diam",
                   "jaula_diam","q","hp","vueltas","vueltas_2"];

function verLectura(i){
  iLinea = i; planoSel = 0; campoActivo = null;
  dibujarLectura();
  mostrar("linea");
}

function dibujarLectura(){
  const ln = OF.lineas[iLinea];
  if (!ln.planos.length){
    if (OF.reedicion){          // re-edición sin plano aún: campos a mano + zona para el plano nuevo
      const editable = rol === "ingenieria";
      const merged = ln.producto;
      const campos = CAMPOS.map(([k, et]) => {
        const v = merged[k];
        if ((v === null || v === undefined || v === "") && !SIEMPRE.includes(k)) return "";
        return `<div class="leido ${v !== undefined && v !== null && v !== "" ? "alta" : "falta"}">
          <div class="et">${et}</div><div>
          <input value="${esc(v ?? "")}" ${editable ? "" : "readonly"}
            onchange="OF.lineas[${iLinea}].asignaciones['${k}']=${
              NUMERICOS.includes(k) ? "(this.value===''?null:parseFloat(this.value.replace(',','.')))" : "this.value"
            };mergearLinea(OF.lineas[${iLinea}]);dibujarLectura()"></div></div>`;
      }).join("");
      $("#pag-linea").innerHTML = `
        <h2 class="titulo">${esc(OF.lote)}-${iLinea + 1} — ${esc(merged.codigo || "?")} · re-edición</h2>
        <div class="dos">
          <div class="plano-caja">
            <div class="zona" id="zonaL" style="min-height:220px">
              <b>Arrastrá el plano corregido</b><br>
              <span class="chico2">o hacé click para elegirlo · reemplaza el plano roto y lee las cotas</span>
              <input type="file" id="pdfInputL" accept="application/pdf" multiple style="display:none">
            </div>
            <div id="estadoCarga"></div>
          </div>
          <div>
            <div class="card"><h3><span>Datos de la orden (editables a mano)</span>
              <button onclick="cancelarReedicion()">✕ Cancelar</button></h3>
              <div class="aviso">Corregí los valores a mano, o subí el plano nuevo para que lea las cotas solo.</div>
              ${campos}
            </div>
            <div class="card"><h3>Listo</h3><div style="padding:12px">
              <button class="primario" onclick="confirmarReedicion()">Confirmar y volver a activas</button>
              <span class="chico2"> — guarda los cambios sin borrar la OF</span>
            </div></div>
          </div>
        </div>`;
      conectarZonaLinea();
      return;
    }
    $("#pag-linea").innerHTML = `
      <h2 class="titulo">${esc(OF.lote)}-${iLinea + 1}</h2>
      <div class="card"><h3><span>Sin planos</span>
        <button onclick="mostrar('nueva');dibujarNueva()">← Volver</button></h3>
        <div style="padding:14px"><div class="zona" id="zonaL">
          <b>Arrastrá los planos de este elemento</b><br>
          <span class="chico2">o hacé click para elegirlos</span>
          <input type="file" id="pdfInputL" accept="application/pdf" multiple style="display:none">
        </div><div id="estadoCarga"></div></div></div>`;
    conectarZonaLinea();
    return;
  }
  if (planoSel >= ln.planos.length) planoSel = 0;
  const L = ln.planos[planoSel].lectura;
  const merged = ln.producto;

  /* --- galería de planos --- */
  const galeria = ln.planos.map((pl, gi) => `
    <div class="mini ${gi === planoSel ? "sel" : ""}" onclick="planoSel=${gi};dibujarLectura()">
      <img src="/api/plano/${encodeURIComponent(pl.lectura.archivo)}/imagen?zoom=0.6" alt="">
      ${rol === "ingenieria" ? `<div class="x" onclick="event.stopPropagation();quitarPlano(${gi})">✕</div>` : ""}
    </div>`).join("")
    + (rol === "ingenieria" ? `<div class="mas" id="masPlano" title="Agregar plano">+</div>` : "");

  /* --- marcas sobre el plano mostrado --- */
  const marca = (o, clase, t) => {
    const x = o.x / L.ancho * 100, y = o.y / L.alto * 100;
    const w = Math.max((o.x1 - o.x) / L.ancho * 100, 1.2);
    const h = Math.max((o.y1 - o.y) / L.alto * 100, .9);
    return `<div class="marca ${clase}" title="${esc(t)}" data-texto="${esc(o.texto)}"
      style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div>`;
  };
  const dud = new Set(L.sin_asignar.filter(s => !s.resuelto).map(s => s.texto));
  const marcas = L.cotas.map(c => marca(c, dud.has(c.texto) ? "duda" : "cota", "Cota: " + c.texto)).join("")
               + L.notas.map(n => marca(n, dud.has(n.texto) ? "duda" : "nota", "Nota: " + n.texto)).join("");

  /* --- campos combinados (editables sólo en ingeniería) --- */
  const editable = rol === "ingenieria";
  const campos = CAMPOS.map(([k, et]) => {
    const v = merged[k];
    if ((v === null || v === undefined || v === "") && !SIEMPRE.includes(k)) return "";
    return `<div class="leido ${v !== undefined && v !== null && v !== "" ? "alta" : "falta"}">
      <div class="et">${et}</div><div>
      <input value="${esc(v ?? "")}" ${editable ? "" : "readonly"}
        onchange="OF.lineas[${iLinea}].asignaciones['${k}']=${
          NUMERICOS.includes(k) ? "(this.value===''?null:parseFloat(this.value.replace(',','.')))" : "this.value"
        };mergearLinea(OF.lineas[${iLinea}]);dibujarLectura()">
      ${editable ? `<div class="porque"><a href="#" onclick="campoActivo='${k}';return false;">asignar del plano mostrado</a></div>` : ""}
      </div></div>`;
  }).join("");

  const pieza = (k, et) => {
    const partes = Object.entries(merged).filter(([kk, vv]) =>
      kk.startsWith(k + "_") && vv !== null && vv !== undefined && vv !== false && vv !== "")
      .map(([kk, vv]) => `${kk.slice(k.length + 1)}: <b>${esc(vv)}</b>`).join(" · ");
    if (!partes) return "";
    return `<div class="leido alta"><div class="et">${et}</div>
      <div><div style="padding:6px 0">${partes}</div></div></div>`;
  };

  /* --- conflictos entre planos --- */
  const conflictos = ln.conflictos.map(c => `<div class="duda">
    <div class="por">El campo <b>${esc(campoNombre(c.campo))}</b> viene distinto en dos planos:</div>
    <div class="bts">${c.opciones.map(o =>
      `<button class="chico" onclick="resolverConflicto('${esc(c.campo)}', ${JSON.stringify(o.valor).replace(/"/g, "&quot;")})">
        ${esc(o.valor)} <span style="opacity:.7">(plano ${o.pi + 1})</span></button>`).join("")}</div>
  </div>`).join("");

  /* --- dudas del plano mostrado --- */
  const dudas = L.sin_asignar.map((s, j) => {
    if (s.resuelto) return `<div class="duda listo"><span class="txt">${esc(s.texto)}</span>
      <div class="por">✓ ${esc(s.resuelto)}</div></div>`;
    const bts = s.tipo === "chapa"
      ? `<button class="chico" onclick="asignarChapa(${j},'nucleo')">Es el núcleo</button>
         <button class="chico" onclick="asignarChapa(${j},'jaula')">Es la jaula</button>
         <button class="chico" onclick="asignarChapa(${j},'nucleo_int')">Núcleo intermedio</button>
         <button class="chico gris" onclick="descartar(${j})">No aplica</button>`
      : ["altura","od","id_int","nucleo_diam","nucleo_int_diam","jaula_diam"].map(k =>
          `<button class="chico" onclick="asignarSuelto(${j},'${k}')">${
            CAMPOS.find(c => c[0] === k)[1].replace(" (mm)", "")}</button>`).join("")
        + `<button class="chico gris" onclick="descartar(${j})">No aplica</button>`;
    return `<div class="duda"><span class="txt">${esc(s.texto)}</span>
      <div class="por">${esc(s.nota)} <span class="chico2">(plano ${planoSel + 1})</span></div>
      <div class="bts solo-ing">${bts}</div></div>`;
  }).join("");

  const difs = ln.planos.flatMap(pl => (pl.lectura.ya_existe || {}).diferencias || []);
  const ya = ln.planos.map(pl => pl.lectura.ya_existe).find(y => y);
  const avisos = [
    ...(difs.length ? [{n:"warn", m:"Ya está en la biblioteca y hay diferencias: " +
        difs.map(d => `<b>${esc(d.campo)}</b> ${esc(d.guardado)} guardado / ${esc(d.leido)} en el plano`).join(" · ")}] : []),
    ...(ya && !difs.length ? [{n:"ok", m:`Ya está en la biblioteca (fabricado ${ya.veces} vez${ya.veces === 1 ? "" : "es"}) y coincide.`}] : []),
    ...ln.planos.flatMap(pl => (pl.lectura.avisos || []).map(a => ({n:"warn", m:a.mensaje})))
  ].map(a => `<div class="aviso ${a.n === "ok" ? "ok" : ""}">${a.m}</div>`).join("");

  $("#pag-linea").innerHTML = `
    <h2 class="titulo">${esc(OF.lote)}-${iLinea + 1} — ${esc(merged.codigo || "?")}</h2>
    <div class="dos">
      <div class="plano-caja">
        <div class="plano-marco" id="marco">
          <img src="/api/plano/${encodeURIComponent(L.archivo)}/imagen" alt="plano">${marcas}
        </div>
        <div class="galeria">${galeria}</div>
        <div class="leyenda">
          <span>${esc(L.archivo)}</span>
          <span><i style="background:#34d399"></i>Cota</span>
          <span><i style="background:#60a5fa"></i>Nota</span>
          <span><i style="background:#fb923c"></i>Sin resolver</span>
        </div>
        <div id="estadoCarga"></div>
      </div>
      <div>
        <div class="card"><h3><span>Datos combinados de ${ln.planos.length} plano(s)</span>
          ${OF.reedicion
            ? `<button onclick="cancelarReedicion()">✕ Cancelar</button>`
            : `<button onclick="mostrar('nueva');dibujarNueva()">← Volver</button>`}</h3>
          ${avisos}${campos}
          ${pieza("nucleo","Núcleo")}${pieza("nucleo_int","Núcleo intermedio")}${pieza("jaula","Jaula")}
        </div>
        ${ln.conflictos.length ? `<div class="card"><h3>Conflictos entre planos</h3>${conflictos}</div>` : ""}
        ${L.sin_asignar.length ? `<div class="card"><h3>Resolver a mano — plano ${planoSel + 1}</h3>${dudas}</div>` : ""}
        <div class="card"><h3>Listo</h3><div style="padding:12px">
          ${OF.reedicion
            ? `<button class="primario" onclick="confirmarReedicion()">Confirmar y volver a activas</button>
               <span class="chico2"> — guarda los planos y datos nuevos sin borrar la OF</span>`
            : `<button class="primario" onclick="marcarLista()">Confirmar este elemento</button>
               <span class="chico2"> — ${ln.lista ? "ya está listo" : "resolvé lo pendiente para poder confirmar"}</span>`}
        </div></div>
      </div>
    </div>`;

  const masP = $("#masPlano");
  if (masP){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/pdf"; inp.multiple = true; inp.style.display = "none";
    document.body.appendChild(inp);
    masP.addEventListener("click", () => inp.click());
    inp.addEventListener("change", async e => {
      await agregarPlanos(iLinea, [...e.target.files]);
      inp.remove(); dibujarLectura();
    });
  }
  document.querySelectorAll("#marco .marca").forEach(m =>
    m.addEventListener("click", () => {
      if (!campoActivo) return;
      const num = parseFloat(String(m.dataset.texto).replace(",", "."));
      const v = NUMERICOS.includes(campoActivo) && !isNaN(num) ? num : m.dataset.texto;
      OF.lineas[iLinea].asignaciones[campoActivo] = v;
      campoActivo = null; mergearLinea(OF.lineas[iLinea]); dibujarLectura();
    }));
}

function conectarZonaLinea(){
  const z = $("#zonaL"), inp = $("#pdfInputL");
  if (!z) return;
  z.addEventListener("click", () => inp.click());
  z.addEventListener("dragover", e => {e.preventDefault(); z.classList.add("encima");});
  z.addEventListener("dragleave", () => z.classList.remove("encima"));
  z.addEventListener("drop", async e => {e.preventDefault();
    await agregarPlanos(iLinea, [...e.dataTransfer.files]); dibujarLectura();});
  inp.addEventListener("change", async e => {
    await agregarPlanos(iLinea, [...e.target.files]); dibujarLectura();});
}

function campoNombre(k){ const c = CAMPOS.find(x => x[0] === k); return c ? c[1] : k; }

function resolverConflicto(campo, valor){
  OF.lineas[iLinea].asignaciones[campo] = valor;
  mergearLinea(OF.lineas[iLinea]); dibujarLectura();
}
function quitarPlano(gi){
  OF.lineas[iLinea].planos.splice(gi, 1);
  if (planoSel >= OF.lineas[iLinea].planos.length) planoSel = 0;
  mergearLinea(OF.lineas[iLinea]); dibujarLectura();
}
function asignarChapa(j, destino){
  const L = OF.lineas[iLinea].planos[planoSel].lectura, s = L.sin_asignar[j];
  L.asignaciones["_" + destino] = s.datos || {};
  L.asignaciones["_" + destino + "_txt"] = s.texto;
  s.resuelto = destino; mergearLinea(OF.lineas[iLinea]); dibujarLectura();
}
function asignarSuelto(j, campo){
  const L = OF.lineas[iLinea].planos[planoSel].lectura, s = L.sin_asignar[j];
  const n = parseFloat(String(s.texto).replace(",", "."));
  L.asignaciones[campo] = isNaN(n) ? s.texto : n;
  s.resuelto = campo; mergearLinea(OF.lineas[iLinea]); dibujarLectura();
}
function descartar(j){
  OF.lineas[iLinea].planos[planoSel].lectura.sin_asignar[j].resuelto = "descartado";
  mergearLinea(OF.lineas[iLinea]); dibujarLectura();
}
function marcarLista(){
  const ln = OF.lineas[iLinea];
  ln.confirmada = true;
  mergearLinea(ln);
  mostrar("nueva"); dibujarNueva();
}

/* ---------- Re-edición de una OF activa (sólo Ingeniería) ----------
   Reabre la línea: vuelve a "en proceso", abre el editor completo (cambiar
   planos + cotas + campos a mano) y al confirmar la devuelve a activas.
   No borra la OF ni toca la biblioteca. */
async function reabrirParaEditar(id){
  if (rol !== "ingenieria") return;
  let r;
  try { r = await api("/api/linea/" + id); }
  catch(e){ return; }
  try { await api("/api/linea/" + id + "/reabrir", {method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify({usuario: rol})}); }
  catch(e){}
  let clientes = []; try { clientes = await api("/api/clientes"); } catch(e){}
  const l = r.linea, d = r.datos || {};
  const ln = nuevaLinea();
  ln.producto  = Object.assign({}, d);
  ln.base      = Object.assign({}, d);   // lo congelado: se conserva si el plano no lo menciona
  ln.cantidad  = l.cantidad;
  ln.etiqueta  = l.etiqueta || null;
  ln.reedicion = true;
  ln.lista     = true;
  OF = { reedicion:{lineaId:id, lote:l.lote_codigo}, lote:l.lote_codigo,
         cliente:l.cliente || "", fecha_entrega:l.fecha_entrega, fecha_oc:l.fecha_oc || null,
         vendedor:"", clientes, lineas:[ln], activa:0 };
  iLinea = 0; planoSel = 0;
  mergearLinea(ln);
  verLectura(0);
}

async function confirmarReedicion(){
  if (!OF || !OF.reedicion) return;
  const id = OF.reedicion.lineaId, ln = OF.lineas[0];
  try{
    await api("/api/linea/" + id + "/reeditar", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        producto: ln.producto, cantidad: ln.cantidad,
        archivos: ln.planos.map(pl => pl.lectura.archivo),
        etiqueta: ln.etiqueta || null, usuario: rol})});
  }catch(e){
    $("#estadoCarga") && ($("#estadoCarga").innerHTML = `<div class="status warn">${esc(e.message)}</div>`);
    return;
  }
  OF = null;
  await cargarResumen();
  verLineaOF(id);
}

async function cancelarReedicion(){
  if (!OF || !OF.reedicion) return;
  const id = OF.reedicion.lineaId;
  try { await api("/api/linea/" + id + "/cancelar_reedicion", {method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify({usuario: rol})}); }
  catch(e){}
  OF = null;
  await cargarResumen();
  verLineaOF(id);
}

async function cargarOF(cual){
  const r = await api("/api/of?estado=" + cual);
  const destino = cual === "activas" ? "#pag-activas" : "#pag-finalizadas";
  if (!r.lotes.length){
    $(destino).innerHTML = `<h2 class="titulo">${cual === "activas" ? "Órdenes activas" : "Finalizadas"}</h2>
      <div class="vacio">No hay órdenes ${cual === "activas" ? "activas" : "finalizadas"}.</div>`;
    return;
  }
  const filas = r.lotes.map(l => {
    const est = [];
    if (l.en_produccion) est.push(`<span class="pill en_produccion">${l.en_produccion} en producción</span>`);
    if (l.pausadas) est.push(`<span class="pill pausada">${l.pausadas} pausada</span>`);
    if (l.pendientes) est.push(`<span class="pill pendiente">${l.pendientes} pendiente</span>`);
    if (l.finalizadas) est.push(`<span class="pill finalizada">${l.finalizadas} finalizada</span>`);
    if (l.con_compra) est.push(`<span class="pill" style="background:#ffedd5;color:#c2410c">compra</span>`);
    return `<tr class="clic" onclick="verLote('${esc(l.codigo)}')">
      <td class="cod">${esc(l.codigo)}</td>
      <td>${esc(l.cliente || "—")}</td>
      <td class="num">${l.lineas}</td>
      <td class="num">${l.total_piezas || "—"}</td>
      <td>${fecha(l.fecha_entrega)}</td>
      <td>${est.join(" ")}</td></tr>`;
  }).join("");
  $(destino).innerHTML = `
    <h2 class="titulo">${cual === "activas" ? "Órdenes activas" : "Finalizadas"}</h2>
    <div class="card"><table><thead><tr>
      <th>Lote</th><th>Cliente</th><th class="num">Líneas</th><th class="num">Piezas</th>
      <th>Entrega</th><th>Estado</th></tr></thead><tbody>${filas}</tbody></table></div>`;
}

let editando = false, edicion = {}, tabLinea = "general";

async function verLineaOF(id, seguirEditando){
  if (!seguirEditando){ editando = false; edicion = {}; }
  const r = await api("/api/linea/" + id);
  if (!seguirEditando) gpRegistrar("linea", id);
  const d = r.datos, c = r.calculado, l = r.linea;
  ESTRUCTURAS_CORTE = r.estructuras_cortables || [];
  const val = k => edicion[k] !== undefined ? edicion[k] : d[k];
  // un campo "vacío": nulo, "" o "-" (el guión significa "no lleva")
  const lleva = k => { const v = val(k); return v !== null && v !== undefined
    && String(v).trim() !== "" && String(v).trim() !== "-"; };

  /* --- un dato: texto o input, segun si se esta editando --- */
  const dato = (et, k, {ancho, unidad} = {}) => {
    const v = val(k);
    if (!editando)
      return `<div class="campo" ${ancho ? 'style="grid-column:1/-1"' : ""}>
        <div class="et">${et}</div>
        <div class="va ${ancho ? "chica" : ""}">${
          unidad === "mm" ? mm(v) : esc(nn(v))}</div></div>`;
    return `<div class="campo" ${ancho ? 'style="grid-column:1/-1"' : ""}>
      <div class="et">${et}</div>
      <input value="${esc(v ?? "")}" onchange="edicion['${k}']=${
        NUMERICOS.includes(k) ? "(this.value===''?null:parseFloat(this.value.replace(',','.')))"
                              : "this.value"}"></div>`;
  };

  const desarrollo = x => {
    const hay = x && x.valor !== null && x.valor !== undefined;
    return `<div class="va" style="color:${hay ? "var(--ok)" : "var(--gris)"};font-weight:${hay ? 700 : 400}">
        ${hay ? mm(x.valor) + (x.corto
          ? `<span style="font-weight:400;color:var(--gris);font-size:12px"> (${esc(x.corto)})</span>` : "")
          : "no se calcula"}</div>
      ${!hay && x && x.detalle ? `<div class="nota">${esc(x.detalle)}</div>` : ""}
      ${x && x.consumo_g ? `<div class="nota"><b>Consumo:</b> ${x.consumo_g} g</div>` : ""}`;
  };

  /* --- indicadores ✅/❌ de la pestaña General --- */
  const tieneForma = f => [val("tipo_medio"), val("tipo_medio_2"), val("tipo_medio_3")]
    .map(x => (x || "").toLowerCase()).includes(f);
  const chk = (label, on) => `<span class="chk">
    <span class="${on ? "si" : "no"}">${on ? "✅" : "❌"}</span> ${label}</span>`;

  /* --- una fila de tapa: material y tipo salen del texto libre --- */
  const tapaFila = (et, k) => {
    const t = val(k) || "";
    const mat = (t.match(/AISI\s*\d+|SAE\s*\d+|acero\s+\w+|galvanizad\w+|inox\w*/i) || ["—"])[0];
    const tipo = (t.match(/repujad\w*|mecanizad\w*|plana|torneada/i) || ["—"])[0];
    return `<tr><td style="width:1%"><b>${et}</b></td>
      <td>${editando
        ? `<input value="${esc(t)}" onchange="edicion['${k}']=this.value">`
        : esc(mat)}</td>
      <td>${editando ? "" : esc(tipo)}</td>
      <td><span class="chico2">${esc(t || "—")}</span></td></tr>`;
  };

  /* --- material compacto: solo material · Ø perforación · espesor --- */
  const matCompacto = pref => {
    const mat = val(pref + "_material"), perf = val(pref + "_perforacion"), esp = val(pref + "_espesor");
    const p = [];
    if (mat) p.push(esc(mat));
    if (perf !== null && perf !== undefined && perf !== "") p.push("Ø" + String(perf).replace(".", ","));
    if (esp !== null && esp !== undefined && esp !== "") p.push("Esp " + mm(esp));
    return p.length ? p.join(" · ") : "—";
  };

  /* --- una estructura: material compacto, Ø interno, altura y desarrollo.
         En edición muestra los campos que leyó el plano (material, conformado,
         tipo de chapa, espesor, Ø perforación, molde) para revisarlos y
         completarlos a mano. El desarrollo se calcula con estos campos. --- */
  const estructura = (pref, et) => {
    const crudo = val(pref + "_crudo");
    if (!lleva(pref + "_crudo") && !val(pref + "_diam") && !editando) return "";
    const it = c[pref] || {};
    const lblS = "display:flex;flex-direction:column;gap:2px;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--gris,#9fb3c8)";
    const inS = "font-size:12px;padding:3px 5px";
    const opt = (cur, arr) => arr.map(o => `<option value="${o}" ${(cur||"")===o?"selected":""}>${o||"—"}</option>`).join("");
    const numOn = k => `edicion['${pref}_${k}']=(this.value===''?null:parseFloat(this.value.replace(',','.')))`;
    const sub = editando ? `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px">
        <label style="${lblS}">Material<input style="${inS}" value="${esc(val(pref+'_material') ?? '')}" onchange="edicion['${pref}_material']=this.value||null"></label>
        <label style="${lblS}">Conformado<select style="${inS}" onchange="edicion['${pref}_conformado']=this.value||null">${opt(val(pref+'_conformado'), ['','espiralado','rolado'])}</select></label>
        <label style="${lblS}">Chapa<select style="${inS}" onchange="edicion['${pref}_tipo_chapa']=this.value||null">${opt(val(pref+'_tipo_chapa'), ['','perforado','ranurado','desplegado'])}</select></label>
        <label style="${lblS}">Espesor mm<input style="${inS}" value="${esc(val(pref+'_espesor') ?? '')}" onchange="${numOn('espesor')}"></label>
        <label style="${lblS}">Ø perforación<input style="${inS}" value="${esc(val(pref+'_perforacion') ?? '')}" onchange="${numOn('perforacion')}"></label>
        <label style="${lblS}">Molde<input style="${inS}" value="${esc(val(pref+'_molde') ?? '')}" onchange="${numOn('molde')}"></label>
      </div>` : "";
    return `<tr>
      <td style="width:1%;vertical-align:top"><b>${et}</b></td>
      <td>${editando
        ? `<input style="width:100%" placeholder="Nota del plano (texto crudo)" value="${esc(crudo ?? "")}" onchange="edicion['${pref}_crudo']=this.value">${sub}`
        : `<span class="chico2">${matCompacto(pref)}</span>`}</td>
      <td class="num" style="width:1%;vertical-align:top">${editando
        ? `<input style="width:82px" value="${esc(val(pref + "_diam") ?? "")}"
             onchange="edicion['${pref}_diam']=(this.value===''?null:parseFloat(this.value.replace(',','.')))">`
        : mm(val(pref + "_diam"))}</td>
      <td class="num" style="width:1%;vertical-align:top">${it.altura != null
        ? mm(it.altura) + (it.principal ? `<div class="chico2" style="color:var(--ok);font-weight:600">más alta</div>` : "")
        : "—"}</td>
      <td style="width:1%; min-width:150px;vertical-align:top">${desarrollo(c[pref])}</td></tr>`;
  };

  const cambio = r.ficha_cambio.length ? `<div class="aviso">
    ⚠️ La ficha del producto cambió después de lanzar esta orden. La orden mantiene
    los datos con los que se lanzó:${r.ficha_cambio.map(x =>
      `<br>· <b>${esc(x.campo)}</b>: en la orden ${esc(nn(x.en_la_orden))} — en la ficha ahora ${esc(nn(x.en_la_ficha))}`).join("")}
    </div>` : "";

  const avisos = r.avisos.map(a =>
    `<div class="aviso ${a.nivel === "bloquea" ? "mal" : ""}">${esc(a.mensaje)}</div>`).join("");

  /* --- avance de fabricación: cada parte se marca completa en su pestaña
         y se refleja acá en General --- */
  const proc = r.procesos || {};
  /* --- medios: cada medio es una fila (Plisado N / Rolado N) con su propio
         checklist. Q y Hp van SIEMPRE en los plisados; el rolado nunca lleva
         pliegues. El desarrollo se calcula por medio segun su forma. --- */
  const contadorForma = {};
  const mediosLista = [["medio", "tipo_medio"], ["medio_2", "tipo_medio_2"], ["medio_3", "tipo_medio_3"]]
    .map(([mk, tk], i) => {
      const hay = lleva(mk);
      const formaRaw = (val(tk) || "").toLowerCase();
      const forma = formaRaw === "rolado" ? "rolado" : "plisado";
      let label;
      if (hay && (formaRaw === "rolado" || formaRaw === "plisado")) {
        const cap = forma.charAt(0).toUpperCase() + forma.slice(1);
        contadorForma[forma] = (contadorForma[forma] || 0) + 1;
        label = cap + " " + contadorForma[forma];
      } else {
        label = "Medio " + (i + 1);
      }
      return {mk, tk, hay, forma, formaRaw, label, base: mk, suf: mk.slice(5), pasos: PASOS_MEDIO[forma]};

  const PARTES = [

    // Q y Hp SOLO en los plisados, POR MEDIO (q/q_2/q_3). Un rolado no lleva pliegues.
    const esPlisado = m.formaRaw === "plisado";
    const celQ = (esPlisado && (m.hay || editando)) ? num("q" + suf) : "—";
    const celHp = (esPlisado && (m.hay || editando)) ? num("hp" + suf) : "—";

    const valorDes = cm && cm.valor != null

      <td class="num" style="width:1%;vertical-align:top">${celHp}</td>

                 ${panelProceso(id, proc, "tapas", TAPA_PASOS[tipoTapa] || [], "Proceso de Tapa 1 completo")}
                 <div class="campo" style="border-right:none;margin-top:10px">

                   </select></div>
                 ${panelProceso(id, proc, "tapas_2", TAPA_PASOS[tipoTapa2] || [], "Proceso de Tapa 2 completo")}`
              : `<div class="campo" style="border-right:none">

                     ${TAPA_TIPOS.map(([v, t]) => `<option value="${v}" ${v === tipoTapa ? "selected" : ""}>${t}</option>`).join("")}
                   </select>
                   <div class="nota">${val("tapa_tipo") || proc._tapa_tipo
                     ? "Elegido a mano." : "Sugerido por el texto de la tapa — cambialo si no corresponde."}</div></div>
                 ${panelProceso(id, proc, "tapas", TAPA_PASOS[tipoTapa] || [], "Proceso de tapas completo")}`}
          </div>

        <!-- SELLOS -->
        <div class="lpanel" id="lp-sellos" ${tabLinea === "sellos" ? "" : 'style="display:none"'}>

                </tr>`).join("")}

            <h3 style="border-radius:0">Proceso de sellos</h3>
            ${panelProceso(id, proc, "sellos", PASOS_SELLO, "Proceso de sellos terminado")}

        <!-- OTROS -->
        <div class="lpanel" id="lp-otros" ${tabLinea === "otros" ? "" : 'style="display:none"'}>

function detectarTipoTapa(txt){
  const t = (txt || "").toLowerCase();
  if (/repuj/.test(t)) return "repujadas";
  if (/mecaniz|tornead/.test(t)) return "mecanizadas";
  if (/3\s*d|impres/.test(t)) return "impresas3d";
  if (/pl[aá]stic|inyect/.test(t)) return "plasticas";
  return null;
}

/* Checklist de pasos generico (tapas, estructuras, medios): sub-pasos + "Completo".
   'base' = prefijo de las claves de proceso; las claves son base + "_" + sufijo,
   y la de "Completo" es 'base' a secas (la que ve General). */
function panelProceso(id, proc, base, pasos, etCompleto){
  const suf = pasos.map(p => p[0]).join(",");
  const chk = (done, scale, handler, et, notaPend) =>
    `<label class="chk chk-parte" style="cursor:pointer">
      <input type="checkbox" ${done ? "checked" : ""} style="width:auto;transform:scale(${scale})" onchange="${handler}">
      <span><b>${et}</b>${done
        ? `<div class="nota">✓ ${esc(done.por || "—")} · ${esc((done.fecha || "").replace("T", " "))}</div>`
        : (notaPend ? `<div class="nota">${notaPend}</div>` : "")}</span></label>`;
  const pasosHtml = pasos.map(([sfx, et]) => {
    const done = proc[base + "_" + sfx];
    // Stock y Compra son excluyentes: si una esta marcada, la otra se tacha y se bloquea
    // (un item se tiene en stock O se compra, no las dos).
    const tachado = (sfx === "stock" && proc[base + "_compra"]) ||
                    (sfx === "compra" && proc[base + "_stock"]);
    if (tachado) {
      return `<div class="campo avance" style="opacity:.45">
        <label class="chk chk-parte" style="cursor:not-allowed">
          <input type="checkbox" disabled style="width:auto;transform:scale(1.3)">
          <span><b style="text-decoration:line-through">${et}</b></span></label></div>`;
    }
    return `<div class="campo avance ${done ? "ok" : ""}">${
      chk(done, "1.3", `marcarPasoGen(${id},'${base}','${suf}','${sfx}',this.checked)`, et, "")}</div>`;
  }).join("");
  const doneC = proc[base];
  return `<div class="qlleva">${pasosHtml}</div>
    <div class="campo avance ${doneC ? "ok" : ""}" style="border-right:none; border-top:2px solid var(--borde)">
      ${chk(doneC, "1.4", `completarGen(${id},'${base}','${suf}',this.checked)`, etCompleto,
            "Marca todos los pasos de arriba y cuenta como completo en General.")}</div>`;
}

/* Un paso. Si quedan TODOS marcados, marca "Completo"; si se destilda uno, lo desmarca. */
async function marcarPasoGen(id, base, suf, sfx, on){
  await postProceso(id, base + "_" + sfx, on);
  const r = await api("/api/linea/" + id);
  const proc = r.procesos || {};
  const todos = suf.split(",").every(s => !!proc[base + "_" + s]);
  await postProceso(id, base, todos);
  verLineaOF(id);
}
/* "Completo": marca (o desmarca) todos los pasos. */
async function completarGen(id, base, suf, completo){
  for (const s of suf.split(",")) await postProceso(id, base + "_" + s, completo);
  await postProceso(id, base, completo);
  verLineaOF(id);
}

/* ---------- optimizador de corte ---------- */
let ESTRUCTURAS_CORTE = [];

function aplicarChapa(){
  const sel = $("#optChapa").value;
  if (sel === "" || sel === "manual"){ return; }
  const ch = window.CHAPAS[parseInt(sel)];
  $("#optW").value = ch.ancho; $("#optH").value = ch.alto;
  calcularCorte(_optId);
}

let _optId = null;
const OPT_COLORES = ["rgba(48,94,160,.32)", "rgba(217,119,6,.32)", "rgba(15,118,110,.32)"];
const OPT_BORDES  = ["#305ea0", "#b45309", "#0f766e"];

async function calcularCorte(id){
  _optId = id;
  const sel = [...document.querySelectorAll(".optEstr:checked")]
    .map(c => ESTRUCTURAS_CORTE[parseInt(c.dataset.i)]).filter(Boolean);
  const W = parseFloat($("#optW").value), H = parseFloat($("#optH").value);
  const cant = parseInt($("#optQ").value) || null;
  const rot = $("#optRot").checked;
  if (!sel.length || !W || !H || !cant){
    $("#optResultado").innerHTML =
      `<div class="chico2">Marcá al menos una estructura, elegí la chapa y cargá la cantidad.</div>`;
    return;
  }

  // color por estructura, en el orden en que aparecen
  const color = {}, borde = {};
  sel.forEach((e, i) => { color[e.etiqueta] = OPT_COLORES[i % OPT_COLORES.length];
                          borde[e.etiqueta] = OPT_BORDES[i % OPT_BORDES.length]; });

  const piezas = sel.map(e => ({label:e.etiqueta, desarrollo:e.desarrollo, altura:e.altura, cantidad:cant}));
  const r = await api("/api/optimizar", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ancho:W, alto:H, rotar:rot, piezas})});
  if (r.error){ $("#optResultado").innerHTML = `<div class="aviso mal">${esc(r.error)}</div>`; return; }

  // aviso si mezclan materiales distintos
  const mats = [...new Set(sel.map(e => (e.material || "").trim().toLowerCase()).filter(Boolean))];
  const avisoMat = (sel.length > 1 && mats.length > 1)
    ? `<div class="aviso">Ojo: las estructuras elegidas tienen materiales distintos
        (${sel.map(e => esc(e.material || "—")).join(", ")}). Se acomodan igual, pero verificá
        que se corten de la misma chapa.</div>` : "";

  const escl = 300 / Math.max(r.ancho_chapa, r.alto_chapa);
  const svgW = r.ancho_chapa * escl, svgH = r.alto_chapa * escl;
  const MAX = 8;
  const hojas = r.hojas.slice(0, MAX).map((h, hi) => {
    const rects = h.piezas.map(p => `<rect x="${(p.x * escl).toFixed(1)}" y="${(p.y * escl).toFixed(1)}"
      width="${(p.w * escl).toFixed(1)}" height="${(p.h * escl).toFixed(1)}"
      fill="${color[p.label] || "rgba(48,94,160,.25)"}" stroke="${borde[p.label] || "#305ea0"}" stroke-width="1"/>`).join("");
    return `<div style="display:inline-block; margin:6px 12px 0 0; text-align:center; vertical-align:top">
      <div class="opt-chapa"><svg class="opt-svg" viewBox="0 0 ${svgW.toFixed(0)} ${svgH.toFixed(0)}"
        width="${svgW.toFixed(0)}" height="${svgH.toFixed(0)}" style="max-width:${svgW.toFixed(0)}px">
        <rect x="0" y="0" width="${svgW.toFixed(1)}" height="${svgH.toFixed(1)}" fill="none" stroke="#305ea0" stroke-width="1.5"/>
        ${rects}</svg></div>
      <div class="chico2" style="margin-top:3px">Chapa ${hi + 1} · ${h.piezas.length} pza${h.piezas.length === 1 ? "" : "s"}</div>
    </div>`;
  }).join("");
  const masHojas = r.hojas.length > MAX
    ? `<div class="chico2" style="margin-top:6px">… y ${r.hojas.length - MAX} chapa(s) más.</div>` : "";

  const leyenda = sel.map(e => `<span class="chico2" style="margin-right:14px">
    <i style="display:inline-block;width:10px;height:10px;border-radius:2px;
       background:${color[e.etiqueta]};border:1px solid ${borde[e.etiqueta]};vertical-align:-1px;margin-right:4px"></i>${esc(e.etiqueta)}</span>`).join("");

  $("#optResultado").innerHTML = `
    ${avisoMat}
    <div class="opt-res">
      <div><div class="n">${r.chapas_necesarias}</div><div class="t">chapa(s) necesarias</div></div>
      <div><div class="n">${r.piezas_total}</div><div class="t">piezas a cortar</div></div>
      <div><div class="n">${r.aprovechamiento}%</div><div class="t">aprovechamiento</div></div>
    </div>
    <div style="padding:2px 0 6px">${leyenda}</div>
    <div>${hojas}</div>${masHojas}
    <div class="chico2" style="margin-top:6px">Chapa ${r.ancho_chapa} × ${r.alto_chapa} mm${r.rotar ? " · con giro" : " · sin giro"}</div>`;
}

async function verFicha(codigo){
  const r = await api("/api/producto/" + encodeURIComponent(codigo));
  const p = r.producto, c = r.calculado;
  const plano = r.planos && r.planos.length ? r.planos[0].nombre : null;

  const desarrollo = x => {
    const hay = x && x.valor !== null && x.valor !== undefined;
    return `<div class="va" style="color:${hay ? "var(--ok)" : "var(--gris)"};font-weight:${hay ? 700 : 400}">
        ${hay ? mm(x.valor) + (x.corto
          ? `<span style="font-weight:400;color:var(--gris);font-size:12px"> (${esc(x.corto)})</span>` : "")
          : "no se calcula"}</div>
      ${!hay && x && x.detalle ? `<div class="nota">${esc(x.detalle)}</div>` : ""}`;
  };
  const matFicha = pref => {
    const mat = p[pref + "_material"], perf = p[pref + "_perforacion"], esp = p[pref + "_espesor"];
    const q = [];
    if (mat) q.push(esc(mat));
    if (perf !== null && perf !== undefined && perf !== "") q.push("Ø" + String(perf).replace(".", ","));
    if (esp !== null && esp !== undefined && esp !== "") q.push("Esp " + mm(esp));
    return q.length ? q.join(" · ") : "—";
  };
  const estructura = (pref, et) => {
    if (!p[pref + "_crudo"] && !p[pref + "_diam"]) return "";
    const it = c[pref] || {};
    return `<tr><td style="width:1%"><b>${et}</b></td>
      <td><span class="chico2">${matFicha(pref)}</span></td>
      <td class="num" style="width:1%">${mm(p[pref + "_diam"])}</td>
      <td class="num" style="width:1%">${it.altura != null
        ? mm(it.altura) + (it.principal ? `<div class="chico2" style="color:var(--ok);font-weight:600">más alta</div>` : "")
        : "—"}</td>
      <td style="width:1%; min-width:150px">${desarrollo(c[pref])}</td></tr>`;
  };
  const hist = r.historial.length ? `<div class="card">
    <h3>Se fabricó ${r.historial.length} ${r.historial.length === 1 ? "vez" : "veces"}</h3>
    <table><thead><tr><th>Lote</th><th>Línea</th><th>Cliente</th><th>Estado</th></tr></thead>
    <tbody>${r.historial.map(h => `<tr><td class="cod">${esc(h.lote_codigo)}</td><td>${nn(h.nro)}</td>
      <td>${esc(h.cliente || "—")}</td><td><span class="pill ${h.estado}">${ESTADO_TXT[h.estado] || h.estado}</span></td></tr>`).join("")}
    </tbody></table></div>` : "";

  $("#pag-ficha").innerHTML = `
    <h2 class="titulo">${esc(p.codigo)}${p.variante_de ? " — variante de " + esc(p.variante_de) : ""}</h2>
    <div class="dos">
      <div class="plano-caja">
        ${plano ? `<div class="plano-marco"><img src="/api/plano/${encodeURIComponent(plano)}/imagen" alt="plano"></div>
          <div class="leyenda"><span>${esc(plano)}</span>
            <a href="/api/plano/${encodeURIComponent(plano)}/pdf" target="_blank">abrir PDF</a></div>`
        : `<div class="vacio" style="border:none">Sin plano cargado.<br>
            <span class="chico2">Se carga al usar este código en una orden nueva.</span></div>`}
      </div>
      <div>
        <div class="card"><h3><span>Ficha técnica</span>
          <button onclick="mostrar('filtros')">← Volver</button></h3>
          ${r.avisos.map(a => `<div class="aviso ${a.nivel === "bloquea" ? "mal" : ""}">${esc(a.mensaje)}</div>`).join("")}
          <div class="grid">
            <div class="campo"><div class="et">Altura</div><div class="va">${mm(p.altura)}</div></div>
            <div class="campo"><div class="et">Diámetro externo</div><div class="va">${mm(p.od)}</div></div>
            <div class="campo"><div class="et">Diámetro interno</div><div class="va">${mm(p.id_int)}</div></div>
            <div class="campo"><div class="et">Q — pliegues</div><div class="va">${nn(p.q)}</div></div>

/* ── Historial interno: flechas atrás / adelante ── */
let gpHist = [], gpHistPos = -1, gpNavegando = false;
function gpRegistrar(tipo, arg){
  if (gpNavegando) return;
  const act = gpHist[gpHistPos];
  if (act && act.tipo === tipo && act.arg === arg) return;   // no duplicar la misma pantalla
  gpHist = gpHist.slice(0, gpHistPos + 1);
  gpHist.push({tipo, arg});
  gpHistPos = gpHist.length - 1;
  gpFlechas();
}
async function gpIrA(h){
  gpNavegando = true;
  try{
    if (h.tipo === "vista") irVista(h.arg);
    else if (h.tipo === "lote") await verLote(h.arg);
    else if (h.tipo === "linea") await verLineaOF(h.arg);
  } catch(e){
    gpHist.splice(gpHistPos, 1);   // esa pantalla ya no existe (ej. lote borrado)
    if (gpHistPos >= gpHist.length) gpHistPos = gpHist.length - 1;
  } finally { gpNavegando = false; gpFlechas(); }
}
function gpFlechas(){
  const a = $("#gpAtras"), d = $("#gpAdelante");
  if (a) a.disabled = gpHistPos <= 0;
  if (d) d.disabled = gpHistPos >= gpHist.length - 1;
}
$("#gpAtras").addEventListener("click", () => { if (gpHistPos > 0){ gpHistPos--; gpIrA(gpHist[gpHistPos]); } });
$("#gpAdelante").addEventListener("click", () => { if (gpHistPos < gpHist.length - 1){ gpHistPos++; gpIrA(gpHist[gpHistPos]); } });

/* Volver a Ariana sin cerrar/reabrir: GASPI vive detrás del proxy de Ariana en /gaspi/,
   así que Ariana es la raíz del mismo origen. Si se abrió GASPI directo (:8000), Ariana
   está en el mismo host puerto 5000. */
$("#gpAriana").addEventListener("click", () => {
  const l = window.location;
  if (l.pathname.startsWith("/gaspi")) l.href = l.origin + "/";
  else l.href = l.protocol + "//" + l.hostname + ":5000/";
});

function irVista(pag){
  gpRegistrar("vista", pag);
  document.querySelectorAll("#gpNav a").forEach(x => x.classList.toggle("on", x.dataset.pag === pag));
  mostrar(pag);
  if (pag === "panel") cargarPanel();
  else if (pag === "nueva") pantallaNueva();
  else if (pag === "enproceso") cargarEnProceso();
  else if (pag === "activas") cargarOF("activas");
  else if (pag === "finalizadas") cargarOF("finalizadas");
  else if (pag === "compras") cargarCompras();
  gpCerrar();
}

async function cargarPanel(){

  const nodos = [

    { n: activas,      m: "OF activas",       e: "activo",                          i: "caja",    pag: "activas"     },
    { n: finalizadas,  m: "OF finalizadas",   e: "activo",                          i: "check",   pag: "finalizadas" },
    { n: compras,      m: "Compras internas", e: compras ? "alerta" : "activo",     i: "carrito", pag: "compras"     },
  ];

  $("#pag-panel").innerHTML = `
    <div class="gp-stage" id="gpStage">
      <svg class="gp-wires" id="gpWires"></svg>

      </div>
      <div id="gpArc">${nodos.map((n, idx) => `
        <div class="gp-ind" data-e="${n.e}" data-i="${idx}" onclick="irVista('${n.pag}')" title="Ir a ${n.m}">
          <div class="dot">${GP_ICON[n.i] || ""}</div>
          <div class="lab"><span class="n">${n.n}</span><span class="m">${n.m}</span></div>
        </div>`).join("")}</div>
    </div>`;
  gpPosicionar();
}

function gpPosicionar(){
  const stage = document.getElementById("gpStage"); if (!stage) return;
  const node = document.getElementById("gpNode"), wires = document.getElementById("gpWires");
  const inds = [...stage.querySelectorAll(".gp-ind")];
  const W = stage.clientWidth, H = stage.clientHeight;

  if (W < 760){ stage.classList.add("stack");
    node.style.width = node.style.height = node.style.left = node.style.top = "";
    inds.forEach(el => { el.style.left = el.style.top = ""; }); return; }
  stage.classList.remove("stack");

  const bigR = Math.max(90, Math.min(Math.min(W, H) * 0.2, 140));
  const cx = W - bigR - 70, cy = H / 2;
  node.style.width = node.style.height = (bigR * 2) + "px";
  node.style.left = cx + "px"; node.style.top = cy + "px";

  const smallR = 33, half = (160 * Math.PI / 180) / 2;
  const R = Math.min(W * 0.42, (H * 0.5 - 74) / Math.max(0.25, Math.sin(half)), cx - 180);
  const n = inds.length, aTop = Math.PI + half, aBot = Math.PI - half;
  wires.innerHTML = "";
  inds.forEach((el, i) => {
    const t = n === 1 ? 0.5 : i / (n - 1), a = aTop + (aBot - aTop) * t;
    const sx = cx + Math.cos(a) * R, sy = cy + Math.sin(a) * R;
    el.style.left = sx + "px"; el.style.top = sy + "px";
    const Sx = cx + Math.cos(a) * bigR, Sy = cy + Math.sin(a) * bigR;
    const Ex = sx - Math.cos(a) * (smallR + 6), Ey = sy - Math.sin(a) * (smallR + 6);
    const dx = (Sx - Ex) * 0.5;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("class", "gp-wire");
    p.setAttribute("d", `M ${Sx} ${Sy} C ${Sx - dx} ${Sy}, ${Ex + dx} ${Ey}, ${Ex} ${Ey}`);
    wires.appendChild(p);
  });
}
window.addEventListener("resize", () => { if (pagActual === "panel") gpPosicionar(); });

function parseEntregaGP(t){
  const m = String(t || "").trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if (!m) return null;
  let y = m[3] ? +m[3] : new Date().getFullYear();
  if (y < 100) y += 2000;
  return `${y}-${String(m[2]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
}

/* Clic en una OF en proceso: abre "Nueva OF" precargada; al confirmarla se
   quita de la carpeta (deja de estar "en proceso" y pasa a activas). */
async function abrirEnProceso(carpeta){
  if (rol !== "ingenieria") return;
  let items = [];
  try { items = await api("/api/en_proceso"); } catch(e){ return; }
  const it = items.find(x => x.carpeta === carpeta);
  if (!it) return;
  const p = await api("/api/of/proximo");
  const clientes = await api("/api/clientes");
  OF = { lote: it.spf, ultimo: p.ultimo, cliente: it.cliente || "",
         fecha_oc: p.fecha_oc,
         fecha_entrega: parseEntregaGP(it.fecha_entrega) || p.fecha_entrega,
         dias: p.dias_entrega, vendedor: it.vendedor || "", clientes,
         lineas: [], activa: null,
         enProceso: carpeta,
         obs: "Derivada de Ariana · N° OC del cliente: " + (it.oc_numero || "—")
              + (it.fecha_entrega ? " · entrega pedida: " + it.fecha_entrega : "") };
  irVista('nueva');
}
